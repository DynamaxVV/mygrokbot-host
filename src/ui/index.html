/* ---------- events ---------- */
// Local fan-out over the single EventSource: features subscribe without competing
// for the SSE callback.
const hostEvents = (() => {
  const listeners = new Set();
  return {
    subscribe(fn) {
      listeners.add(fn);
      return () => listeners.delete(fn);
    },
    publish(ev) {
      for (const fn of listeners) {
        try { fn(ev); } catch { /* a broken listener must not break the stream */ }
      }
    },
  };
})();

// Ask the host whether a turn is actually running, and align the composer with it.
async function syncRunState() {
  try {
    const st = await rpc('getHostStatus', {});
    busyAgents.clear();
    for (const id of st?.runningAgents ?? []) busyAgents.add(id);
    // Older hosts only report a count; treat that as "the active bot is busy".
    if (!st?.runningAgents && Number(st?.runningTurns ?? 0) > 0 && activeId) busyAgents.add(activeId);
    restoreComposer();
  } catch { /* keep the current state when the host is unreachable */ }
}

function connectEvents() {
  const es = new EventSource(`/events${TOKEN ? `?token=${encodeURIComponent(TOKEN)}` : ''}`);
  es.onopen = () => {
    $('conn').textContent = 'live';
    $('conn').className = 'pill live';
    syncRunState();
  };
  es.onerror = () => { $('conn').textContent = 'reconnecting'; $('conn').className = 'pill down'; };
  es.onmessage = (msg) => {
    const ev = JSON.parse(msg.data);
    hostEvents.publish(ev);
    // Lifecycle events must update the per-bot busy set even when that bot is not the
    // one on screen — otherwise its 思考中 never clears.
    if (ev.type === 'turn-start' && ev.hidden) hiddenTurns.add(ev.turnId);
    if (ev.type === 'turn-end' || ev.type === 'turn-error' || ev.type === 'turn-interrupted') {
      hiddenTurns.delete(ev.turnId);
    }
    if (ev.agentId && ev.type === 'turn-start') setBusy(true, ev.agentId);
    if (ev.agentId && (ev.type === 'turn-end' || ev.type === 'turn-error' || ev.type === 'turn-interrupted')) {
      setBusy(false, ev.agentId);
    }
    if (ev.agentId && ev.agentId !== activeId) {
      // Only real content moves the timestamp: bumping it on every event (including
      // queue noise) made the whole roster read "now" forever.
      const a = agents.find((x) => x.id === ev.agentId);
      if (a && ev.type === 'transcript' && !ev.entry?.hidden) {
        a.lastActivityMs = ev.entry?.timestampMs ?? a.lastActivityMs;
        renderRoster();
      }
      return;
    }
    switch (ev.type) {
      case 'transcript': {
        if (ev.entry?.hidden) return;
        const cached = ev.entry.id;
        // The optimistic row already carries this id; appending again would show the
        // operator's own message twice.
        const existing = entries.findIndex((e) => e.id === cached);
        if (existing >= 0) {
          entries[existing] = { ...entries[existing], ...ev.entry };
        } else {
          entries.push(ev.entry);
        }
        // If a node is already showing this row under another key, re-key it.
        const nodes = document.querySelectorAll('[data-entry-id]');
        for (const n of nodes) {
          const key = n.dataset.entryId;
          if (key !== cached && changedMids.get(key) === cached) n.dataset.entryId = cached;
        }
        renderStream();
        break;
      }
      case 'text-delta': {
        // The answer has begun: fold this turn's reasoning with the transition.
        if (ev.turnId && String(ev.text ?? '').length > 0) {
          const r = document.querySelector(`.reasoning[data-turn-id="${ev.turnId}"]`);
          // Fold only once there is a real answer to hand over to.
          if (r && r.classList.contains('open') && r.dataset.state === 'running') {
            const body = r.querySelector('.rbody > div');
            if (body && body.textContent.trim().length > 0) {
              r.dataset.state = 'ok';
              r.classList.remove('open');
            }
          }
        }
        bumpGen(String(ev.text ?? '').length);
        const host = document.querySelector(`.msg[data-entry-id="${ev.entryId}"] .btext`);
        if (host) {
          host.textContent = cleanText(host.textContent + ev.text);
          $('log').scrollTop = $('log').scrollHeight;
        } else {
          entries.push({ kind: 'send-message', id: ev.entryId, message: { type: 'text', content: ev.text }, timestampMs: Date.now() });
          renderStream();
        }
        break;
      }
      case 'reasoning-delta': {
        // The reasoning entry id changes per turn merge, so match by turn first.
        let d = document.querySelector(
          ev.turnId ? `.reasoning[data-turn-id="${ev.turnId}"] .rbody > div` : null,
        );
        if (!d) d = document.querySelector(`.reasoning[data-entry-id="${ev.entryId}"] .rbody > div`);
        if (!d) {
          // Fall back to the newest reasoning block: one turn, one block, always.
          const all = document.querySelectorAll('.reasoning');
          const last = all[all.length - 1];
          if (last && last.dataset.state === 'running') {
            d = last.querySelector('.rbody > div');
            if (last.dataset.turnId == null && ev.turnId) last.dataset.turnId = ev.turnId;
          }
        }
        if (d) {
          d.textContent = cleanText(d.textContent + ev.text);
          const host = d.closest('.reasoning');
          if (host) {
            host.querySelector('.rpeek').textContent = firstMeaningfulLine(d.textContent);
            host.dataset.state = 'running';
            host.classList.add('open');
          }
          autoScroll();
        } else {
          // Append the node in place: a full re-render would rebuild it and drop `open`.
          entries.push({ kind: 'reasoning', id: ev.entryId, turnId: ev.turnId, text: ev.text, timestampMs: Date.now() });
          const node = nodeFor({
            kind: 'reasoning',
            id: ev.entryId,
            turnId: ev.turnId,
            text: cleanText(ev.text),
            running: true,
          });
          if (node) {
            const log = $('log');
            const empty = log.querySelector('.empty');
            if (empty) empty.remove();
            log.appendChild(node);
            node.dataset.state = 'running';
            node.classList.add('open');
            autoScroll();
          }
        }
        break;
      }
      case 'tool-call':
      case 'approval-request':
      case 'widget-request':
        if (ev.entry) {
          entries = entries.filter((e) => e.id !== ev.entry.id);
          entries.push(ev.entry);
          renderStream();
        }
        break;
      case 'agent-to-user':
        // A different bot messaged the operator. Append it if we are showing that bot,
        // otherwise just flag the roster so the operator notices.
        if (ev.entry) {
          if (ev.agentId === activeId) {
            entries = dedupe([...entries.filter((e) => e.id !== ev.entry.id), ev.entry]);
            renderStream();
          } else {
            const a = agents.find((x) => x.id === ev.agentId);
            if (a) a.unread = (a.unread ?? 0) + 1;
            renderRoster();
          }
        }
        break;
      case 'turn-start':
      case 'queue-dequeued':
        setBusy(true, ev.agentId ?? activeId);
        // Only refresh the pending set; re-rendering here would rebuild the live
        // reasoning node and drop its open state.
        rpc('getPendingEntryIds', { agentId: activeId })
          .then((p) => { pendingIds = new Set(p ?? []); })
          .catch(() => {});
        break;
      case 'turn-end':
        // Freeze the measured throughput onto the turn: the number stays visible in the
        // answer footer after generation stops.
        if (genStatsFor(ev.agentId ?? activeId) && ev.turnId) {
          const g = genStatsFor(ev.agentId ?? activeId);
          const secs = Math.max(0.2, (Date.now() - g.startedAt) / 1000);
          turnUsage.set(ev.turnId, {
            ...(ev.usage ?? {}),
            charsPerSec: g.chars > 0 ? Math.round(g.chars / secs) : null,
            measuredMs: Math.round(Date.now() - g.startedAt),
          });
        }
        setBusy(false, ev.agentId ?? activeId);
        // The answer is finished: fold this turn's reasoning first, so the transition
        // plays, then let the reload settle the final state.
        if (ev.turnId && hiddenTurns.has(ev.turnId)) {
          reloadTranscript();
          break;
        }
        if (ev.turnId) {
          const r = document.querySelector(`.reasoning[data-turn-id="${ev.turnId}"]`);
          if (r && r.dataset.state === 'running') {
            r.dataset.state = 'ok';
            r.classList.remove('open');
          }
        }
        if (ev.turnId) {
          settledTurns.add(ev.turnId);
          // Merge rather than replace: the rate captured above must survive.
          turnUsage.set(ev.turnId, { ...(turnUsage.get(ev.turnId) ?? {}), ...(ev.usage ?? {}) });
        }
        // The status line stays quiet once the answer's own footer carries the numbers.
        $('status').textContent = '';
        reloadTranscript();
        break;
      case 'turn-error':
        setBusy(false, ev.agentId ?? activeId);
        if (ev.turnId) settledTurns.add(ev.turnId);
        $('status').textContent = ev.error;
        reloadTranscript();
        break;
      case 'turn-interrupted':
        setBusy(false, ev.agentId ?? activeId);
        if (ev.turnId) settledTurns.add(ev.turnId);
        $('status').textContent = '已停止';
        reloadTranscript();
        break;
      case 'approval-expired':
      case 'approval-resolved':
        reloadTranscript();
        refreshPaneData();
        break;
      default:
        break;
    }
  };
}

function reloadTranscript() {
  if (!activeId) return;
  Promise.all([
    rpc('getAgentTranscript', { agentId: activeId, limit: 300 }),
    rpc('getAgentOutline', { agentId: activeId }).catch(() => []),
    rpc('getPendingEntryIds', { agentId: activeId }).catch(() => []),
  ])
    .then(([rows, outline, pending]) => {
      pendingIds = new Set(pending ?? []);
      entries = dedupe(mergeOutline(rows.slice().sort((a, b) => a.seq - b.seq), outline ?? []));
      renderStream();
    })
    .catch(() => {});
  refreshPaneData();
}

// Modal form dialog. Resolves to a field map, or null when cancelled.
// `fields`: [{ name, label, value, placeholder, type, rows }]
function askForm({ title, fields, submitLabel = '保存' }) {
  return new Promise((resolve) => {
    const wrap = document.createElement('div');
    wrap.className = 'askdlg';
    const rows = fields.map((f) => {
      const id = `ask-${f.name}`;
      const control = f.rows
        ? `<textarea id="${id}" rows="${f.rows}" placeholder="${esc(f.placeholder ?? '')}">${esc(f.value ?? '')}</textarea>`
        : `<input id="${id}" type="${f.type ?? 'text'}" value="${esc(f.value ?? '')}" placeholder="${esc(f.placeholder ?? '')}" />`;
      return `<label class="ask-row"><span>${esc(f.label)}</span>${control}</label>`;
    }).join('');
    wrap.innerHTML = `
      <div class="ask-card">
        <div class="ask-head">${esc(title)}</div>
        <div class="ask-body">${rows}</div>
        <div class="ask-foot">
          <button class="s-act" data-cancel>取消</button>
          <button class="s-act primary" data-ok>${esc(submitLabel)}</button>
        </div>
      </div>`;
    document.body.appendChild(wrap);

    const read = () => {
      const out = {};
      for (const f of fields) out[f.name] = wrap.querySelector(`#ask-${f.name}`).value.trim();
      return out;
    };
    const done = (value) => { wrap.remove(); resolve(value); };
    wrap.querySelector('[data-cancel]').onclick = () => done(null);
    wrap.querySelector('[data-ok]').onclick = () => done(read());
    wrap.onclick = (e) => { if (e.target === wrap) done(null); };
    wrap.onkeydown = (e) => {
      if (e.key === 'Escape') { e.stopPropagation(); done(null); }
      else if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); done(read()); }
    };
    const first = wrap.querySelector('.ask-body input, .ask-body textarea');
    first?.focus();
    first?.select?.();
  });
}

// Double-click to edit, Cmd/Ctrl+Enter or blur to save, Esc to cancel.
function makeEditable(el, { multiline = false, placeholder = '', save }) {
  el.classList.add('editable');
  el.title = '双击编辑';
  el.ondblclick = () => {
    if (el.querySelector('textarea, input')) return;
    const raw = el.textContent === '（空）' ? '' : el.textContent;
    const rect = el.getBoundingClientRect();
    const editor = document.createElement(multiline ? 'textarea' : 'input');
    editor.className = 'inline-edit';
    editor.value = raw;
    if (placeholder) editor.placeholder = placeholder;
    el.textContent = '';
    el.appendChild(editor);
    el.classList.add('editing');
    // Pin the field's box: its height used to come from the text, which now lives in the
    // absolutely positioned editor — without this the memory field collapsed.
    el.style.boxSizing = 'border-box';
    el.style.height = `${Math.round(rect.height)}px`;
    el.style.width = `${Math.round(rect.width)}px`;
    editor.focus();
    editor.setSelectionRange?.(editor.value.length, editor.value.length);

    let done = false;
    const finish = async (commit) => {
      if (done) return;
      done = true;
      const value = editor.value;
      el.classList.remove('editing');
      el.style.height = '';
      el.style.width = '';
      el.style.boxSizing = '';
      if (commit && value !== raw) {
        el.textContent = value || '—';
        try { await save(value); $('status').textContent = '已保存'; }
        catch (err) { el.textContent = raw; $('status').textContent = `保存失败：${err.message}`; }
      } else {
        el.textContent = raw;
      }
    };
    editor.onblur = () => finish(true);
    editor.onkeydown = (e) => {
      e.stopPropagation();
      if (e.key === 'Escape') { e.preventDefault(); finish(false); }
      else if (e.key === 'Enter' && (!multiline || e.metaKey || e.ctrlKey)) { e.preventDefault(); finish(true); }
    };
  };
}

// Files are uploaded immediately (so a large one does not block send), then their
// workspace paths ride along with the prompt.
let pendingFiles = [];

function renderChips() {
  const box = $('chips');
  box.innerHTML = '';
  box.classList.toggle('on', pendingFiles.length > 0);
  pendingFiles.forEach((f, i) => {
    const el = document.createElement('span');

async function uploadFile(file) {
  const res = await fetch('/api/attachments', {
    method: 'POST',
    headers: { 'x-filename': encodeURIComponent(file.name) },
    body: file,
  });
  const body = await res.json();
  if (!body.ok) throw new Error(body.error ?? 'upload failed');
  return body;
}

  const files = [...(e.target.files ?? [])];
  e.target.value = '';
  for (const f of files) {
    try {
      $('status').textContent = `上传 ${f.name}…`;
      const r = await uploadFile(f);
      pendingFiles.push({ name: r.name, path: r.relativePath, bytes: r.bytes });
      renderChips();
      $('status').textContent = '';
    } catch (err) {
      $('status').textContent = `上传失败：${err.message}`;
    }

});

// Paste an image straight into the composer.
$('input').addEventListener('paste', async (e) => {
  const items = [...(e.clipboardData?.items ?? [])];
  const imgs = items.filter((i) => i.kind === 'file').map((i) => i.getAsFile()).filter(Boolean);
  if (!imgs.length) return;
  e.preventDefault();
  for (const f of imgs) {
    try {
      const named = new File([f], f.name || `paste-${Date.now()}.png`, { type: f.type });
      const r = await uploadFile(named);
      pendingFiles.push({ name: r.name, path: r.relativePath, bytes: r.bytes });
      renderChips();
    } catch (err) { $('status').textContent = `上传失败：${err.message}`; }
  }
});

  { id: 'review', label: '自动审批' },
  { id: 'about', label: '关于与维护' },
];

function renderSettings() {
  const { st, review, host, provider } = settingsData ?? {};
  const nav = $('settingsNav');
  const body = $('settingsBody');
  if (!nav || !body) return;

  const lang = st?.language === 'en' ? 'en' : 'zh';
  const notif = st?.notifications?.isEnabled !== false;
  const msgs = st?.messagesEnabled !== false;
  const botColor = st?.botColorInChatEnabled !== false;
  const tunnel = st?.egressTunnelEnabled === true;
  const reviewOn = st?.autoReviewInstructions?.isEnabled !== false;
  const ceiling = review?.ceilings?.shell ?? 'ASK';
  const allowList = review?.alwaysAllow ?? [];
  const allowRules = st?.autoReviewInstructions?.allowInstructions ?? [];
  const blockRules = st?.autoReviewInstructions?.blockInstructions ?? [];
  const port = location.port || '80';

  const sw = (id, on) => `<button class="s-switch" id="${id}" role="switch" aria-checked="${on}"></button>`;
  const row = (label, desc, ctl) =>
    `<div class="s-row"><span class="s-label">${label}<span class="s-desc">${desc}</span></span>${ctl}</div>`;

  const GROUP_NOTICE = `<div class="s-row"><div class="s-main2">`
    + `<div class="s-k">群聊不绑定模型</div>`
    + `<div class="s-d">群聊只负责把消息转发给成员 bot，模型和密钥由各成员自己决定。</div>`
    + `</div></div>`;
  const isGroupAgent = agents.find((a) => a.id === activeId)?.isGroup === true;

  const sections = {
    provider: () => row('接入地址', 'OpenAI 兼容的 base URL，末尾不带 /chat/completions',
        `<input type="text" id="setBaseUrl" value="${esc(provider?.baseUrl ?? '')}" placeholder="https://api.example.com/v1" />`)
      + row('模型 ID', '当前 bot 使用的模型',
        `<input type="text" id="setModelId" value="${esc(provider?.modelId ?? '')}" placeholder="model-name" />`)
      + row('API Key', provider?.keyIsSet
          ? `已配置${provider.keyPreview ? '（' + esc(provider.keyPreview) + '）' : ''}，留空则保持不变`
          : '尚未配置，填入后写入本机密钥文件（权限 600）',
        `<input type="password" id="setApiKey" value="" placeholder="${provider?.keyIsSet ? '••••••••' : 'sk-...'}" autocomplete="off" />`)
      + row('密钥变量名', 'binding 里只存这个变量名，不存密钥本身',
        `<input type="text" id="setKeyEnv" value="${esc(provider?.apiKeyEnv ?? '')}" />`)
      + row('连接测试', '请求 /models 验证地址与密钥',
        `<span class="s-val" id="tvResult"></span><button class="s-act" id="actTest">测试</button>`)
      + row('保存', '写入绑定与密钥文件', `<button class="s-act" id="actSaveProvider">保存</button>`),

    look: () => row('界面语言', '影响界面文案与 bot 写入记忆的语言',
        `<select id="setLang"><option value="zh"${lang === 'zh' ? ' selected' : ''}>中文</option><option value="en"${lang === 'en' ? ' selected' : ''}>English</option></select>`)
      + row('气泡配色', '按 bot 区分聊天气泡颜色', sw('setBotColor', botColor))
      + row('时区', '定时任务按此时区触发',
        `<input type="text" id="setTz" value="${esc(st?.userTimeZone ?? '')}" />`),

    notify: () => row('桌面通知', '任务完成或需要批准时提醒', sw('setNotif', notif))
      + row('消息接收', '允许 bot 主动发消息给你', sw('setMsgs', msgs))
      + row('外网隧道', '把本机网关暴露到公网（谨慎开启）', sw('setTunnel', tunnel)),

    review: () => row('启用自动审批', '关闭后所有命令都需要手动确认', sw('setReview', reviewOn))
      + row('shell 审批策略', '命令执行前的确认方式',
        `<select id="setCeiling">
          <option value="ASK"${ceiling === 'ASK' ? ' selected' : ''}>每次询问</option>
          <option value="ALWAYS"${ceiling === 'ALWAYS' ? ' selected' : ''}>总是允许</option>
          <option value="NEVER"${ceiling === 'NEVER' ? ' selected' : ''}>从不允许</option>
        </select>`)
      + row('常驻放行', '已被记住的命令',
        `<span class="s-val">${allowList.length} 条</span><button class="s-act danger" id="clearAllow">清空</button>`)
      + row('允许规则', '命中的命令直接放行',
        `<span class="s-val">${allowRules.length} 条</span><button class="s-act" id="editAllow">编辑</button>`)
      + row('拒绝规则', '命中的命令直接拒绝',
        `<span class="s-val">${blockRules.length} 条</span><button class="s-act" id="editBlock">编辑</button>`),

    about: () => row('数据目录', '所有 bot 与对话的存放位置',
        `<span class="s-val">${esc(host?.root ?? '~/.mygrokbot')}</span>`)
      + row('网关端口', '本机 HTTP 服务端口', `<span class="s-val">${esc(port)}</span>`)
      + row('bot 数量', '当前名册', `<span class="s-val">${host?.agentCount ?? '—'}</span>`)
      + row('版本', '许可证与版本', `<span class="s-val">GPL-3.0 · mygrokbot</span>`)
      + row('技能目录', '重新扫描已安装技能', `<button class="s-act" id="actRefresh">刷新</button>`)
      + row('导出对话', '把当前对话存成 Markdown', `<button class="s-act" id="actExport">导出</button>`)
      + row('重新加载', '重新读取设置与名册', `<button class="s-act" id="actReload">重新加载</button>`),
  };

  // One continuous column: every section renders, headers and dividers separate them.
  // The left nav scrolls to a section instead of swapping content — that keeps the
  // reading position and makes cross-section edits feel like one form.
  body.innerHTML = SETTINGS_SECTIONS
    .map((sec) => `<section class="s-group" id="sec-${sec.id}">`
      + `<div class="s-sec">${sec.label}</div>`
      + (sec.id === 'provider' && isGroupAgent ? GROUP_NOTICE : (sections[sec.id]?.() ?? ''))
      + '</section>')
    .join('');

  nav.innerHTML = '';
  for (const sec of SETTINGS_SECTIONS) {
    const b = document.createElement('button');
    b.textContent = sec.label;
    b.dataset.section = sec.id;
    b.onclick = () => {
      const target = body.querySelector(`#sec-${sec.id}`);
      if (!target) return;
      body.scrollTo({ top: Math.max(0, target.offsetTop), behavior: 'smooth' });
    };
    nav.appendChild(b);
  }

  // Highlight the section currently in view.
  const markActive = () => {
    const at = body.scrollTop + 40;
    let current = SETTINGS_SECTIONS[0].id;
    for (const sec of SETTINGS_SECTIONS) {
      const el = body.querySelector(`#sec-${sec.id}`);
      if (el && el.offsetTop <= at) current = sec.id;
    }
    for (const b of nav.querySelectorAll('button')) {
      b.classList.toggle('on', b.dataset.section === current);
    }
  };
  body.onscroll = markActive;
  markActive();

  const bindSwitch = (id, apply) => {
    const el = body.querySelector('#' + id);
    if (!el) return;
    el.onclick = async () => {
      const next = el.getAttribute('aria-checked') !== 'true';
      el.setAttribute('aria-checked', String(next));
      try { await apply(next); $('status').textContent = '已保存'; }
      catch (err) { el.setAttribute('aria-checked', String(!next)); $('status').textContent = err.message; }
    };
  };
  bindSwitch('setBotColor', (v) => rpc('setHostSettings', { patch: { botColorInChatEnabled: v } }));
  bindSwitch('setNotif', (v) => rpc('setHostSettings', { patch: { notifications: { isEnabled: v } } }));
  bindSwitch('setMsgs', (v) => rpc('setHostSettings', { patch: { messagesEnabled: v } }));
  bindSwitch('setTunnel', (v) => rpc('setHostSettings', { patch: { egressTunnelEnabled: v } }));
  bindSwitch('setReview', (v) => rpc('setHostSettings', { patch: { autoReviewInstructions: { isEnabled: v } } }));

  body.querySelector('#actSaveProvider')?.addEventListener('click', async () => {
    const btn = body.querySelector('#actSaveProvider');
    btn.disabled = true;
    try {
      const payload = {
        agentId: activeId,
        baseUrl: body.querySelector('#setBaseUrl').value.trim(),
        modelId: body.querySelector('#setModelId').value.trim(),
        apiKeyEnv: body.querySelector('#setKeyEnv').value.trim(),
      };
      const key = body.querySelector('#setApiKey').value;
      if (key) payload.apiKey = key;
      await rpc('setProviderConfig', payload);
      settingsData.provider = await rpc('getProviderConfig', { agentId: activeId });
      binding = await rpc('getAgentBinding', { agentId: activeId });
      $('model').textContent = binding.modelId ?? '—';
      renderSettings();
      $('status').textContent = '模型接入已保存';
    } catch (err) {
      $('status').textContent = `保存失败：${err.message}`;
    } finally { btn.disabled = false; }
  });

  body.querySelector('#actTest')?.addEventListener('click', async () => {
    const out = body.querySelector('#tvResult');
    out.textContent = '测试中…';
    try {
      const r = await rpc('testProvider', {
        agentId: activeId,
        baseUrl: body.querySelector('#setBaseUrl').value.trim(),
        apiKey: body.querySelector('#setApiKey').value || undefined,
      });
      out.textContent = r.ok ? `✓ ${r.ms}ms · ${r.models} 个模型` : `✗ ${r.error}`;
    } catch (err) { out.textContent = `✗ ${err.message}`; }
  });

  body.querySelector('#setLang')?.addEventListener('change', async (e) => {
    try { await rpc('setLanguage', { language: e.target.value }); $('status').textContent = '语言已保存，刷新页面生效'; }
    catch (err) { $('status').textContent = err.message; }
  });
  body.querySelector('#setTz')?.addEventListener('change', async (e) => {
    try { await rpc('setHostSettings', { patch: { userTimeZone: e.target.value.trim() } }); $('status').textContent = '时区已保存'; }
    catch (err) { $('status').textContent = err.message; }
  });
  body.querySelector('#setCeiling')?.addEventListener('change', async (e) => {
    try {
      await rpc('setAutoReviewRules', { patch: { ceilings: { shell: e.target.value } } });
      settingsData.review = await rpc('getAutoReviewRules');
      reviewRules = settingsData.review; renderPane();
      $('status').textContent = `shell 策略 → ${e.target.value}`;
    } catch (err) { $('status').textContent = err.message; }
  });
  body.querySelector('#clearAllow')?.addEventListener('click', async () => {
    if (!allowList.length) { $('status').textContent = '没有常驻放行的命令'; return; }
    if (!confirm(`清空 ${allowList.length} 条常驻放行命令？`)) return;
    await rpc('setAutoReviewRules', { patch: { alwaysAllow: [] } });
    settingsData.review = await rpc('getAutoReviewRules');
    reviewRules = settingsData.review; renderSettings();
  });
  const editRules = async (key, current, title) => {
    const res = await askForm({
      title,
      fields: [{ name: 'rules', label: '每行一条', value: current.join('\n'), rows: 6 }],
    });
    if (!res) return;
    const list = res.rules.split('\n').map((x) => x.trim()).filter(Boolean);
    await rpc('setHostSettings', { patch: { autoReviewInstructions: { [key]: list } } });
    settingsData.st = await rpc('getHostSettings', {});
    renderSettings();
  };
  body.querySelector('#editAllow')?.addEventListener('click', () => editRules('allowInstructions', allowRules, '允许规则'));
  body.querySelector('#editBlock')?.addEventListener('click', () => editRules('blockInstructions', blockRules, '拒绝规则'));
  body.querySelector('#actRefresh')?.addEventListener('click', async () => {
    try { const r = await rpc('refreshSkills', {}); $('status').textContent = `已刷新，${r?.count ?? ''} 个技能`; }
    catch (err) { $('status').textContent = err.message; }
  });
  body.querySelector('#actExport')?.addEventListener('click', () => { closeSettings(); exportCurrent(); });
  body.querySelector('#actReload')?.addEventListener('click', async () => {
    await openSettings();
    $('status').textContent = '已重新加载';
  });
}

async function openSearch() {
  $('searchPanel').classList.add('open');
  $('searchInput').value = '';
  $('searchResults').innerHTML = '<div class="sempty">输入关键词，搜索所有 bot 的历史消息</div>';
  $('searchInput').focus();
}

function closeSearch() { $('searchPanel').classList.remove('open'); }

let searchTimer = null;
$('searchInput')?.addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  const q = e.target.value.trim();
  if (!q) {
    $('searchResults').innerHTML = '<div class="sempty">输入关键词，搜索所有 bot 的历史消息</div>';
    return;
  }
  searchTimer = setTimeout(() => runSearch(q), 180);
});

async function runSearch(q) {
  const box = $('searchResults');
  box.innerHTML = '<div class="sempty">搜索中…</div>';
  try {
    const hits = await rpc('searchTranscripts', { query: q, limit: 40 });
    if (!hits.length) { box.innerHTML = '<div class="sempty">没有匹配的消息</div>'; return; }
    box.innerHTML = '';
    for (const h of hits) {
      const el = document.createElement('div');
      el.className = 'sres';
      el.innerHTML = `<div class="sbot"></div><div class="stext"></div>`;
      el.querySelector('.sbot').textContent =
        `${h.agentName} · ${fmtTime(h.timestampMs)}`;
      const txt = el.querySelector('.stext');
      // Highlight the hit without innerHTML from user data.
      const i = h.snippet.toLowerCase().indexOf(q.toLowerCase());
      if (i >= 0) {
        txt.append(document.createTextNode(h.snippet.slice(0, i)));
        const mark = document.createElement('mark');
        mark.textContent = h.snippet.slice(i, i + q.length);
        txt.append(mark, document.createTextNode(h.snippet.slice(i + q.length)));
      } else txt.textContent = h.snippet;
      el.onclick = () => { closeSearch(); selectAgent(h.agentId); };
      box.appendChild(el);
    }
  } catch (err) {
    box.innerHTML = `<div class="sempty">搜索失败：${esc(err.message)}</div>`;
  }
}

async function editRoutine(existing) {

    title: isNew ? '新建定时任务' : '编辑定时任务',
    fields: [
      { name: 'name', label: '名称', value: existing?.name ?? '' },

      { name: 'prompt', label: '任务内容', value: existing?.prompt ?? '', rows: 4 },
    ],
  });
  if (!res) return;
  const name = res.name;
  const cron = res.cron;

  const args = {
    agentId: activeId,
    name: name.trim() || '未命名任务',
    prompt: promptText.trim(),
    cron: cron.trim(),

  const call = isNew
    ? rpc('createAgentAutomation', args)

    .then(() => { $('status').textContent = isNew ? '已创建任务' : '已保存'; refreshPaneData(); })
    .catch((err) => { $('status').textContent = err.message; });

const genStatsByAgent = new Map(); // agentId -> { startedAt, chars, tokens, thinking }
// The active bot's stats; every read goes through here so switching bots switches stats.
function genStatsFor(id = activeId) { return genStatsByAgent.get(id) ?? null; }

// Busy is per bot: the engine runs turns independently, so one agent thinking must not
// put every other agent's composer into 思考中.
const busyAgents = new Set();
const drafts = new Map();   // agentId -> unsent composer text

function setBusy(busy, agentId = activeId) {
  if (!agentId) return;
  if (busy) busyAgents.add(agentId); else busyAgents.delete(agentId);
  if (agentId !== activeId) return;
  $('stop').classList.toggle('on', busy);
  if (!busy) {
    genStatsByAgent.delete(agentId);
    if (agentId === activeId) updateHint();
    return;
  }
  if (!genStatsFor(agentId)) {
    genStatsByAgent.set(agentId, { startedAt: Date.now(), chars: 0, tokens: 0, thinking: true });
  }
  if (agentId === activeId) updateHint();
}

// Reflect the active bot's own busy state and draft.
function restoreComposer() {
  const busy = busyAgents.has(activeId);
  $('stop').classList.toggle('on', busy);
  if (!busy) { updateHint(); }
  $('input').value = drafts.get(activeId) ?? '';
  $('input').dispatchEvent(new Event('input'));
}

function bumpGen(chars, tokens = 0) {
  let g = genStatsFor();
  if (!g) { g = { startedAt: Date.now(), chars: 0, tokens: 0, thinking: true }; genStatsByAgent.set(activeId, g); }
  g.chars += chars;
  g.tokens += tokens;
  updateHint();
}

// Throughput hint under the composer: chars/s and, once the provider reports usage,
// real tokens/s. Chars are a stream-rate proxy — the only live signal available.
// While the model is still reasoning there is no output to measure, so say what phase
// it is in instead of showing a meaningless "0 字/秒".
// The hint line was removed; the live rate now lives in the status line, which only
// speaks while something is happening.
function updateHint() {
  const g = genStatsFor();
  if (!g) return;
  const secs = Math.max(0.2, (Date.now() - g.startedAt) / 1000);
  // Characters per second is the only live signal; tokens only exist at turn end.
  const cps = Math.round(g.chars / secs);
  if (g.thinking) {
    $('status').textContent = `思考中… ${secs.toFixed(0)}s`;
    return;
  }
  $('status').textContent = `生成中… ${cps} 字/秒`;
}
$('input').addEventListener('input', () => {

$('input').addEventListener('keydown', (e) => {
  if (!mentionState) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const n = mentionState.items.length;
    mentionState.index = (mentionState.index + (e.key === 'ArrowDown' ? 1 : n - 1)) % n;
    renderMentionPop();
  } else if (e.key === 'Tab' || (e.key === 'Enter' && !e.shiftKey)) {
    e.preventDefault();
    e.stopPropagation();
    pickMention(mentionState.index);
  } else if (e.key === 'Escape') {
    e.stopPropagation();
    closeMention();
  }
}, true);

$('input').addEventListener('input', (e) => {

});
// IME: while a Chinese/Japanese/Korean candidate window is open, Enter and Space belong
// to the IME (commit the candidate), not to the composer. Without this guard, picking a
// word sent the message. `isComposing` covers Chrome/Safari; the trailing guard covers
// WebKit delivering the final keydown right after compositionend.
let composing = false;
$('input').addEventListener('compositionstart', () => { composing = true; });
$('input').addEventListener('compositionend', () => {
  // The keydown for the committing Enter/Space may still arrive; ignore it once.
  setTimeout(() => { composing = false; }, 0);
});
$('input').addEventListener('keydown', (e) => {
  if (e.isComposing || composing || e.keyCode === 229) return;
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

$('paletteInput').addEventListener('input', (e) => renderPalette(e.target.value));
$('palette').addEventListener('click', (e) => { if (e.target.id === 'palette') closePalette(); });

document.addEventListener('keydown', (e) => {
  const meta = e.metaKey || e.ctrlKey;
  if (e.key === 'Escape') {
    if (replyTarget) { clearReply(); return; }
    if ($('settingsPanel').classList.contains('open')) { closeSettings(); return; }
    if ($('searchPanel').classList.contains('open')) { closeSearch(); return; }
    if ($('modelMenu').classList.contains('open')) { $('modelMenu').classList.remove('open'); return; }
    if ($('stop').classList.contains('on')) { e.preventDefault(); stopTurn(); return; }
  }
  if (meta && e.key === ',') { e.preventDefault(); openSettings(); return; }
  if (meta && e.key === 'f') { e.preventDefault(); openSearch(); return; }
  if (meta && e.key === 'k') { e.preventDefault(); openPalette(); return; }
  if (meta && e.shiftKey && (e.key === 'i' || e.key === 'I')) { e.preventDefault(); togglePane(); return; }
  if (meta && e.key === ',') { e.preventDefault(); openPalette(); return; }
  if (!$('palette').classList.contains('open')) return;
  if (e.key === 'Escape') { closePalette(); return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    paletteSel = Math.max(0, Math.min(paletteItems.length - 1, paletteSel + (e.key === 'ArrowDown' ? 1 : -1)));
    [...$('paletteList').children].forEach((el, i) => el.classList.toggle('sel', i === paletteSel));
    return;
  }
  if (e.key === 'Enter') { e.preventDefault(); runCommand(paletteItems[paletteSel]); }
});

boot().catch((err) => {
  $('log').innerHTML = `<div class="empty" style="margin:auto">${String(err.message)}</div>`;
});
</script>
</body>
</html>
