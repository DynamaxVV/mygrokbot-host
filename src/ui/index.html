<script>
const TOKEN = new URLSearchParams(location.search).get('token') || window.__MGB_TOKEN__ || '';
const $ = (id) => document.getElementById(id);

let agents = [];
let activeId = null;
let entries = [];
let binding = {};
let uimap = null;
let commands = [];
let activeTab = 'overview';
let searchQuery = '';
let searchHits = [];      // transcript matches for the rail search
let searchHitsFor = '';   // the query those hits belong to
let hostStatus = {};
let routines = [];
let reviewRules = {};
let hostSettings = {};
const hiddenTurns = new Set(); // turns whose rows belong to another surface
let pendingIds = new Set();
// DSH folds a finished turn's process only once the reader moves on: the newest turn
// stays open, and sending anything collapses it. Keyed by turnId.
let latestTurnId = null;
const procOpenState = new Map();
// turnId -> { total_tokens, elapsedMs }; filled from turn-end and reused in the footer.
const turnUsage = new Map();
// Turns the host has already closed. renderTurnProcess uses this so a late transcript
// snapshot cannot re-open a finished turn's reasoning.
const settledTurns = new Set();
// nonce -> entryId, mirroring the host's ChangedMids: a node rendered optimistically
// under the nonce is re-keyed in place once the row lands (tweb does the same).
const changedMids = new Map();

// Twelve hues, ordered so neighbouring entries contrast. Assignment is by position in
// the roster, not by hashing the id — a hash made unrelated bots collide on the same hue.
const COLORS = [
  '#2f6fed', '#19b57a', '#e8941e', '#e0457b', '#7c5cff', '#12b5c9',
  '#e8733f', '#8b6b4a', '#3f4a5a', '#c2334d', '#5aa02f', '#b04fd0',
];
const colorForIndex = (i) => COLORS[Math.abs(Number(i) || 0) % COLORS.length];
const agentIndex = (id) => {
  const i = agents.findIndex((a) => a.id === id);
  return i < 0 ? 0 : i;
};
const colorFor = (id) => colorForIndex(agentIndex(id));
const initialOf = (name) => (name || '?').trim().slice(0, 1).toUpperCase();

// Avatar silhouettes (viewBox 0 0 100 100). The box itself is transparent: only the
// shape is painted, so avatars float on the surface instead of sitting in a tile.
const AVATAR_SHAPES = {
  circle:   '<circle cx="50" cy="50" r="45"/>',
  squircle: '<rect x="6" y="6" width="88" height="88" rx="30"/>',
  blob:     '<path d="M50 5c24 0 46 16 46 44 0 30-22 46-46 46S4 79 4 49C4 21 26 5 50 5Z"/>',
  diamond:  '<rect x="15" y="15" width="70" height="70" rx="20" transform="rotate(45 50 50)"/>',
  flower:   '<path d="M50 9c9 0 13 7 18 10s17 1 21 9-4 14-4 19 8 10 4 18-15 5-21 8-9 13-18 13-13-10-18-13-17 0-21-8 4-13 4-18-8-10-4-18 15-5 21-8 9-12 18-12Z"/>',
  drop:     '<path d="M50 4c16 22 35 34 35 53a35 35 0 0 1-70 0C15 38 34 26 50 4Z"/>',
  pill:     '<rect x="5" y="26" width="90" height="48" rx="24"/>',
  triangle: '<path d="M50 8 92 82a9 9 0 0 1-8 13H16a9 9 0 0 1-8-13Z"/>',
  pentagon: '<path d="M50 5 95 37 78 90H22L5 37Z"/>',
  hexagon:  '<path d="M50 4 91 27v46L50 96 9 73V27Z"/>',
  shield:   '<path d="M50 4 92 20v32c0 26-19 39-42 46-23-7-42-20-42-46V20Z"/>',
  heart:    '<path d="M50 92C20 73 5 57 5 37 5 21 17 10 31 10c8 0 15 4 19 11 4-7 11-11 19-11 14 0 26 11 26 27 0 20-15 36-45 55Z"/>',
};
const AVATAR_SHAPE_IDS = Object.keys(AVATAR_SHAPES);
const SHAPE_ALIASES = { rounded: 'squircle', square: 'squircle' };

function avatarShapeOf(agent) {
  const raw = agent?.avatarShape ?? 'circle';
  const id = SHAPE_ALIASES[raw] ?? raw;
  return AVATAR_SHAPES[id] ? id : 'circle';
}

// Render an avatar as inline SVG. `size` only sets the CSS box.
// `outline` draws a ring in the surface colour behind the fill, which is what keeps
// overlapping avatars readable in a group cluster.
function avatarHTML(agent, size, extraClass = '', outline = false) {
  const color = agent?.avatarColor || colorFor(agent?.id);
  const shape = AVATAR_SHAPES[avatarShapeOf(agent)];
  const glyph = String(agent?.avatarGlyph ?? '').trim();
  // Face content: a custom glyph when set, otherwise the default pair of eyes.
  const eyes = glyph
    ? `<text x="50" y="50" text-anchor="middle" dominant-baseline="central"
         font-size="${glyph.length > 1 ? 34 : 44}" font-weight="700" fill="#fff"
         font-family="-apple-system, system-ui, sans-serif">${esc(glyph)}</text>`
    : (size && size < 14
        ? ''
        : '<rect x="33" y="41" width="10" height="21" rx="5" fill="#fff" opacity=".95"/>'
          + '<rect x="57" y="41" width="10" height="21" rx="5" fill="#fff" opacity=".95"/>');
  const cls = `avatar${extraClass ? ' ' + extraClass : ''}`;
  const style = size ? ` style="width:${size}px;height:${size}px"` : '';
  // paint-order:stroke paints the ring under the fill, so only its outer half shows —
  // that is what separates overlapping avatars in a group cluster.
  const ring = outline
    ? ' stroke="var(--surface)" stroke-width="7" stroke-linejoin="round" paint-order="stroke"'
    : '';
  // Every silhouette is drawn 0..100, and the ring adds 3.5 units outward, so the group
  // is scaled to 0.9 around the centre — otherwise the edges clip at the viewBox.
  return `<span class="${cls}"${style}>`
    // The transform wraps the face too: scaling only the silhouette made the eyes look
    // oversized inside a shrunken shape.
    + '<svg viewBox="0 0 100 100" aria-hidden="true">'
    + '<g transform="translate(50 50) scale(.9) translate(-50 -50)">'
    + `<g fill="${color}"${ring}>${shape}</g>`
    + eyes
    + '</g></svg></span>';
}

// Per-agent appearance overrides live in the profile: avatarColor / avatarShape / avatarGlyph.
function avatarColorOf(agent, fallbackId) {
  return agent?.avatarColor || colorFor(agent?.id ?? fallbackId);
}
const esc = (s) => String(s ?? '');

async function rpc(method, args = {}) {
  const res = await fetch(`/api/${method}`, {
    method: 'POST',
    headers: { 'content-type': 'application/json', ...(TOKEN ? { authorization: `Bearer ${TOKEN}` } : {}) },
    body: JSON.stringify(args),
  });
  const payload = await res.json();
  if (!payload.ok) throw new Error(payload.error || `${method} failed`);
  return payload.result;
}

/* ---------- time, Telegram style ---------- */
const dayKey = (ms) => new Date(ms).toDateString();
function fmtDay(ms) {
  const d = new Date(ms), now = new Date();
  const diff = Math.round((new Date(now.toDateString()) - new Date(d.toDateString())) / 86400000);
  if (diff === 0) return '今天';
  if (diff === 1) return '昨天';
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function fmtTime(ms) {
  return ms ? new Date(ms).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' }) : '';
}
function fmtRelative(ms) {
  if (!ms) return '';
  const s = (Date.now() - ms) / 1000;
  if (s < 60) return 'now';
  if (s < 3600) return `${Math.floor(s / 60)}m`;
  if (s < 86400) return fmtTime(ms);
  if (s < 604800) return new Date(ms).toLocaleDateString(undefined, { weekday: 'short' });
  return new Date(ms).toLocaleDateString(undefined, { month: 'numeric', day: 'numeric' });
}

/* ---------- grouping ----------
   Window and radius values are taken from tweb (Telegram Web K, GPL-3.0):
     bubbleGroups.ts  newGroupDiff = 121        // seconds, not minutes
     _chatVariables.scss  $bubble-border-radius-big: 15px; ...-medium: 5px
     _chatBubble.scss     &.no-brt / &.no-brb zero the inner corners
   Adjacent bubbles stay separate when more than 121s apart. */
const GROUP_WINDOW_MS = 121 * 1000;
function senderKey(entry) {
  // A user message is always its own bubble: consecutive sends are separate actions,
  // and merging them made two independent prompts look like one edited message. The
  // key still has to be non-null, because the renderer uses "key != null" to decide
  // that a row is a message at all — returning null dropped every user row from the
  // screen. So it is unique per entry, which also forces a group break.
  if (entry.kind === 'message' && entry.role === 'user') {
    return entry.fromAgent ? `bot:${entry.fromAgent.id}` : `me:${entry.id}`;
  }
  // A bot speaking on its own initiative (message_user) is not the reply of this turn:
  // it groups by sender like any other incoming bot message.
  if (entry.kind === 'message' && entry.role === 'assistant' && entry.fromAgent) {
    return `bot:${entry.fromAgent.id}`;
  }
  // Key by the actual sender: a group has several bots replying, and the literal 'bot'
  // merged every one of them into a single bubble.
  if (entry.kind === 'send-message' && entry.message?.type === 'text') {
    return entry.fromAgent?.id ? `bot:${entry.fromAgent.id}` : 'bot';
  }
  return null;
}
function annotateGroups(list) {
  const keyed = list.map((e) => ({ entry: e, key: senderKey(e) }));
  return keyed.map((cur, i) => {
    const prev = keyed[i - 1];
    const next = keyed[i + 1];
    const same = (a, b) =>
      a && b && a.key != null && a.key === b.key &&
      Math.abs((b.entry.timestampMs ?? 0) - (a.entry.timestampMs ?? 0)) < GROUP_WINDOW_MS &&
      dayKey(a.entry.timestampMs ?? 0) === dayKey(b.entry.timestampMs ?? 0);
    const joinPrev = same(prev, cur);
    const joinNext = same(cur, next);
    const pos = !joinPrev && !joinNext ? 'single' : !joinPrev ? 'start' : joinNext ? 'mid' : 'end';
    return { ...cur, pos };
  });
}

/* ---------- rendering ---------- */
// A group's avatar is a 2x2 cluster of its members' colours, which is how the real
// panel distinguishes a room from a single bot at a glance.
function groupAvatar(memberIds, size = 40) {
  const all = memberIds ?? [];
  // Above four members the cluster stops being readable, so it collapses into the same
  // 2x2 shape every time: three faces plus a count badge.
  const overflow = all.length > 4;
  const ids = overflow ? all.slice(0, 3) : all.slice(0, 4);
  // Overlap = 2*ratio-1 for two cells side by side. These keep every layout at ~45%
  // so a group reads as one cluster regardless of member count.
  // 4-up packs four cells into one box, so it needs a slightly smaller cell than the
  // two-up case or the corners swallow each other.
  const ratio = overflow
    ? 0.58
    : { 0: 0.96, 1: 0.96, 2: 0.70, 3: 0.64, 4: 0.60 }[ids.length];
  const cellSize = Math.round(size * ratio);
  const box = `width:${cellSize}px;height:${cellSize}px`;

  if (!all.length) {
    return `<span class="avatar group n1" style="width:${size}px;height:${size}px">`
      + `<span class="gcell" style="${box}">${avatarHTML({ id: 'group', name: '#' }, cellSize)}</span></span>`;
  }

  const cells = ids.map((id) => {
    const a = agents.find((x) => x.id === id);
    // A member whose agent was deleted still gets a placeholder, never a blank cell.
    return `<span class="gcell" style="${box}">`
      + avatarHTML(a ?? { id, name: '?' }, cellSize, '', true) + '</span>';
  });

  if (overflow) {
    const more = all.length - 3;
    cells.push('');
    return `<span class="avatar group n4 has-more" style="width:${size}px;height:${size}px">`
      + cells.map((c, i) => (i === 3
        ? `<span class="gcell gmore" style="${box}">+${more}</span>`
        : c)).join('')
      + '</span>';
  }

  return `<span class="avatar group n${ids.length}" style="width:${size}px;height:${size}px">`
    + cells.join('') + '</span>';
}

function renderRoster() {
  const box = $('agents');
  const hero = $('hero');
  box.innerHTML = '';
  if (hero) hero.innerHTML = '';

  const q = searchQuery.toLowerCase();
  const mainId = hostSettings?.mainAgentId ?? null;
  // No chief of staff: nothing is pinned, the whole roster is one list.
  const main = mainId ? (agents.find((a) => a.id === mainId) ?? null) : null;
  const rest = agents.filter((a) => a.id !== main?.id);
  const list = rest.filter((a) => !q || `${a.name} ${a.description}`.toLowerCase().includes(q));

  // Hero: the main bot, pinned above the list and excluded from it.
  if (hero && main && !q) {
    const el = document.createElement('div');
    el.className = `hero${main.id === activeId ? ' active' : ''}`;
    // Seeded profiles from earlier versions carry the English role name.
    const TITLES = { 'Chief of staff': '幕僚长' };
    const rawTitle = main.title ? (TITLES[main.title] ?? main.title) : '';
    const badge = rawTitle || (main.isGroup ? '群聊' : '');
    el.innerHTML = `
      ${main.isGroup ? groupAvatar(main.memberIds, 52) : avatarHTML(main, 52, 'big')}
      <span class="hmeta"><span class="hname"></span>${badge ? '<span class="hbadge"></span>' : ''}</span>`;
    el.querySelector('.hname').textContent = main.name;
    if (badge) el.querySelector('.hbadge').textContent = badge;
    el.onclick = () => selectAgent(main.id);
    el.oncontextmenu = (ev) => {
      ev.preventDefault();
      setChiefOfStaff(main, {
        isMain: true,
        holder: null,
        mainId: hostSettings?.mainAgentId ?? null,
      });
    };
    hero.appendChild(el);
  }

  if (!list.length) {
    if (!q) return; // nothing but the hero: no empty-state noise
    if (!searchHits.length) {
      box.innerHTML = `<div class="empty" style="padding:18px 10px">没有匹配的 bot 或消息</div>`;
      return;
    }
  }

  // Message hits appear under the bots while a query is active.
  const renderHits = () => {
    if (!q || searchHitsFor !== searchQuery.trim() || !searchHits.length) return;
    const head = document.createElement('div');
    head.className = 'hitsec';
    head.textContent = `消息记录 · ${searchHits.length}`;
    box.appendChild(head);
    for (const h of searchHits) {
      const el = document.createElement('div');
      el.className = 'hit';
      el.innerHTML = `<span class="hmeta"><span class="hbot"></span><span class="htime"></span></span><span class="htext"></span>`;
      el.querySelector('.hbot').textContent = h.agentName ?? '';
      el.querySelector('.htime').textContent = h.timestampMs ? fmtTime(h.timestampMs) : '';
      const txt = el.querySelector('.htext');
      const needle = searchQuery.trim();
      const i = String(h.snippet ?? '').toLowerCase().indexOf(needle.toLowerCase());
      if (i >= 0) {
        txt.append(document.createTextNode(h.snippet.slice(0, i)));
        const mk = document.createElement('mark');
        mk.textContent = h.snippet.slice(i, i + needle.length);
        txt.append(mk, document.createTextNode(h.snippet.slice(i + needle.length)));
      } else txt.textContent = h.snippet ?? '';
      el.onclick = () => { selectAgent(h.agentId); };
      el.ondblclick = () => { jumpToEntry(h.agentId, h.entryId); };
      el.title = '单击切换 bot，双击跳到这条消息';
      box.appendChild(el);
    }
  };

  for (const a of list) {
    const el = document.createElement('div');
    el.className = `agent${a.id === activeId ? ' active' : ''}`;
    el.innerHTML = `
      ${a.isGroup
        ? groupAvatar(a.memberIds, 40)
        : avatarHTML(a, 40)}
      <span class="meta">
        <span class="row1"><span class="name"></span><span class="time"></span></span>
        <span class="sub"></span>
      </span>`;
    el.querySelector('.name').textContent = a.name;
    el.querySelector('.sub').textContent = (a.lastText || a.description || a.id.slice(0, 8))
      .replace(/\s+/g, ' ');
    el.querySelector('.time').textContent = a.proxied ? 'remote' : fmtRelative(a.lastActivityMs);
    el.onclick = () => selectAgent(a.id);
    box.appendChild(el);
  }
  renderHits();
}

// Avatar editor: silhouette + face (eyes or a glyph) + colour. Tabs mirror the real
// panel: pick from the built-in set, randomise, or upload an image.
function openAvatarEditor(agent) {
  if (!agent) return;
  const cur = {
    color: agent.avatarColor || colorFor(agent.id),
    shape: avatarShapeOf(agent),
    glyph: String(agent.avatarGlyph ?? '').trim(),
    image: agent.avatarImage ?? '',
  };
  let draft = { ...cur };
  let tab = 'bot';

  const wrap = document.createElement('div');
  wrap.className = 'avedit';
  wrap.innerHTML = `
    <div class="ave-card">
      <div class="ave-preview"><span data-p></span></div>
      <div class="ave-tabs">
        <button data-tab="bot" class="on">Bot</button>
        <button data-tab="gen">生成</button>
        <button data-tab="up">上传</button>
        <span class="sp"></span>
        <button class="reset" data-reset>重置</button>
      </div>
      <div data-pane></div>
      <div class="ave-foot">
        <button class="s-act" data-cancel>取消</button>
        <button class="s-act" data-save>保存</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);

  const preview = wrap.querySelector('[data-p]');
  const pane = wrap.querySelector('[data-pane]');
  const paintPreview = () => {
    preview.innerHTML = draft.image
      ? `<span class="avatar xl"><img src="${draft.image}" alt="" style="width:100%;height:100%;object-fit:contain"/></span>`
      : avatarHTML({ ...agent, ...draft, avatarGlyph: draft.glyph }, 72, 'xl');
  };

  const renderEditor = () => {
    for (const b of wrap.querySelectorAll('.ave-tabs button[data-tab]')) {
      b.classList.toggle('on', b.dataset.tab === tab);
    }
    pane.innerHTML = '';
    if (tab === 'bot') {
      const grid = document.createElement('div');
      grid.className = 'ave-grid';
      for (const id of AVATAR_SHAPE_IDS) {
        const b = document.createElement('button');
        b.className = 'ave-shape' + (id === draft.shape ? ' on' : '');
        b.innerHTML = avatarHTML({ ...agent, ...draft, avatarShape: id, avatarImage: '' }, 38);
        b.title = id;
        b.onclick = () => { draft.shape = id; draft.image = ''; renderEditor(); paintPreview(); };
        grid.appendChild(b);
      }
      pane.appendChild(grid);

      const colors = document.createElement('div');
      colors.className = 'ave-colors';
      for (const c of COLORS) {
        const b = document.createElement('button');
        b.className = 'ave-sw' + (c === draft.color ? ' on' : '');
        b.style.background = c;
        b.onclick = () => {
          draft.color = c;
          colors.querySelectorAll('.ave-sw').forEach((x) => x.classList.toggle('on', x === b));
          paintPreview();
        };
        colors.appendChild(b);
      }
      pane.appendChild(colors);

      const glyphRow = document.createElement('div');
      glyphRow.className = 'ave-row';
      glyphRow.innerHTML = `<span>文字</span><input data-glyph maxlength="2" value="${esc(draft.glyph)}" placeholder="留空显示眼睛" />`;
      glyphRow.querySelector('input').oninput = (e) => {
        draft.glyph = e.target.value.slice(0, 2);
        paintPreview();
      };
      pane.appendChild(glyphRow);
    } else if (tab === 'gen') {
      const box = document.createElement('div');
      box.className = 'ave-upload';
      box.innerHTML = '<div style="font-size:12px;color:var(--faint)">随机组合：形状 + 颜色</div>';
      const btn = document.createElement('button');
      btn.className = 's-act';
      btn.textContent = '换一组';
      btn.onclick = () => {
        draft.shape = AVATAR_SHAPE_IDS[Math.floor(Math.random() * AVATAR_SHAPE_IDS.length)];
        draft.color = COLORS[Math.floor(Math.random() * COLORS.length)];
        draft.image = '';
        paintPreview();
        box.querySelector('.gen-out').innerHTML = avatarHTML({ ...agent, ...draft }, 64, 'xl');
      };
      const out = document.createElement('div');
      out.className = 'gen-out';
      out.style.cssText = 'display:flex;justify-content:center;padding:8px 0';
      out.innerHTML = avatarHTML({ ...agent, ...draft }, 64, 'xl');
      box.appendChild(btn);
      box.appendChild(out);
      pane.appendChild(box);
    } else {
      const box = document.createElement('div');
      box.className = 'ave-upload';
      box.innerHTML = `<div style="font-size:12px;color:var(--faint)">上传 PNG / SVG，背景保持透明</div>
        <input type="file" accept="image/*" data-file />`;
      box.querySelector('[data-file]').onchange = (e) => {
        const f = e.target.files?.[0];
        if (!f) return;
        if (f.size > 256 * 1024) { $('status').textContent = '图片请小于 256KB'; return; }
        const reader = new FileReader();
        reader.onload = () => { draft.image = String(reader.result); paintPreview(); };
        reader.readAsDataURL(f);
      };
      pane.appendChild(box);
    }
    paintPreview();
  };

  wrap.querySelectorAll('[data-tab]').forEach((b) => {
    b.onclick = () => { tab = b.dataset.tab; renderEditor(); };
  });
  wrap.querySelector('[data-reset]').onclick = () => {
    draft = { color: colorFor(agent.id), shape: 'circle', glyph: '', image: '' };
    renderEditor();
  };
  const close = () => wrap.remove();
  wrap.querySelector('[data-cancel]').onclick = close;
  wrap.onclick = (e) => { if (e.target === wrap) close(); };
  wrap.querySelector('[data-save]').onclick = async () => {
    const patch = {
      avatarColor: draft.color,
      avatarShape: draft.shape,
      avatarGlyph: draft.glyph,
      ...(draft.image ? { avatarImage: draft.image } : {}),
    };
    if (!draft.image) patch.avatarImage = '';
    try {
      await rpc('updateAgent', { agentId: agent.id, patch });
      Object.assign(agent, patch);
      const a = agents.find((x) => x.id === agent.id);
      if (a) Object.assign(a, patch);
      close();
      renderRoster();
      renderEditor();
      $('status').textContent = '图标已更新';
    } catch (err) { $('status').textContent = `保存失败：${err.message}`; }
  };

  renderEditor();
}

// Open the bot (if needed) and scroll the given entry into view, then flash it.
async function jumpToEntry(agentId, entryId) {
  if (agentId !== activeId) await selectAgent(agentId);
  // The transcript renders asynchronously after the switch; give it a beat, then retry
  // a couple of times in case the row is not in the DOM yet.
  for (let attempt = 0; attempt < 8; attempt += 1) {
    const el = document.querySelector(`[data-entry-id="${entryId}"]`);
    if (el) {
      el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 1800);
      $('status').textContent = '已定位到该消息';
      return;
    }
    await new Promise((r) => setTimeout(r, 120));
  }
  $('status').textContent = '这条消息不在当前视图（可能已被截断）';
}

// Deleting a bot is irreversible and takes its transcript and memory with it, so it
// needs an explicit confirmation naming the bot.
async function deleteBot(agent) {
  if (!agent) return;
  const label = agent.isGroup ? `群聊「${agent.name}」` : `bot「${agent.name}」`;
  if (!confirm(`确定删除${label}？\n\n对话记录、记忆和本地数据都会一起删除，此操作不可撤销。`)) return;
  try {
    await rpc('deleteAgents', { agentIds: [agent.id] });
    if (hostSettings?.mainAgentId === agent.id) {
      hostSettings = await rpc('setHostSettings', { patch: { mainAgentId: null } }).catch(() => hostSettings);
    }
    agents = await rpc('listAgents').catch(() => agents.filter((a) => a.id !== agent.id));
    const next = agents[0]?.id ?? null;
    if (next) await selectAgent(next); else { renderRoster(); renderPane(); }
    $('status').textContent = `${label}已删除`;
  } catch (err) { $('status').textContent = `删除失败：${err.message}`; }
}

// Promote or demote the chief-of-staff role. The title follows the role: the holder
// gets 幕僚长, the previous holder loses it.
async function setChiefOfStaff(agent, { isMain, holder, mainId }) {
  if (!agent) return;
  if (isMain) {
    if (!confirm(`取消「${agent.name}」的幕僚长身份？\n\n取消后没有任何 bot 是幕僚长。`)) return;
    try {
      hostSettings = await rpc('setHostSettings', { patch: { mainAgentId: null } });
      // Clear the title on every bot, not only the one that held it — a stale 幕僚长
      // label on another bot would contradict the empty role.
      for (const a of agents) {
        if (a.title === '幕僚长') {
          await rpc('updateAgent', { agentId: a.id, patch: { title: '' } }).catch(() => {});
          a.title = '';
        }
      }
      renderRoster(); renderPane();
      $('status').textContent = '已取消幕僚长，当前没有幕僚长';
    } catch (err) { $('status').textContent = err.message; }
    return;
  }
  const msg = holder
    ? `把幕僚长从「${holder}」换成「${agent.name}」？\n\n原来的幕僚长会恢复为普通 bot。`
    : `把「${agent.name}」设为幕僚长？\n\n它会置顶在左栏，并带上「幕僚长」职衔。`;
  if (!confirm(msg)) return;
  try {
    hostSettings = await rpc('setHostSettings', { patch: { mainAgentId: agent.id } });
    await rpc('updateAgent', { agentId: agent.id, patch: { title: '幕僚长' } });
    agent.title = '幕僚长';
    if (mainId && mainId !== agent.id) {
      const prev = agents.find((a) => a.id === mainId);
      if (prev && prev.title === '幕僚长') {
        await rpc('updateAgent', { agentId: prev.id, patch: { title: '' } }).catch(() => {});
        prev.title = '';
      }
    }
    renderRoster(); renderPane();
    $('status').textContent = `${agent.name} 已设为幕僚长`;
  } catch (err) { $('status').textContent = err.message; }
}

// Choose which bot is pinned as the main one (the hero at the top of the rail).

function describeEvent(entry) {
  const ev = entry.event ?? {};
  switch (ev.type) {
    case 'name-changed': return `由「${ev.from}」改名为「${ev.to}」`;
    case 'created': return '已创建';
    default: return ev.type ?? 'event';
  }
}

function nodeFor(entry) {
  const t = entry.kind;
  if (t === 'event') {
    // "created" is roster noise; only renames and other state changes are worth a line.
    if (entry.event?.type === 'created') return null;
    const el = document.createElement('div');
    el.className = 'service';
    el.textContent = describeEvent(entry);
    return el;
  }
  if (t === 'notice') {
    // Interrupts borrow the approval-card shape: a small header line and the detail,
    // in the same column and with the same border as every other system action.
    if (entry.level === 'warn') {
      const card = document.createElement('div');
      card.className = 'card noticecard';
      card.innerHTML = `<div class="ct"><span class="nico">⏹</span><span>本轮已中断</span></div>
        <div class="cb"></div>`;
      card.querySelector('.cb').textContent = entry.text ?? '';
      return card;
    }
    const el = document.createElement('div');
    el.className = 'service';
    el.textContent = entry.text ?? '';
    return el;
  }
  if (t === 'reasoning') {
    const text0 = cleanText(entry.text ?? '');
    if (!text0) return null; // an empty reasoning row is a bare bar with no meaning
    const el = document.createElement('div');
    el.className = 'reasoning';
    el.dataset.entryId = entry.id;
    if (entry.turnId) el.dataset.turnId = entry.turnId;
    const text = cleanText(entry.text ?? '');
    el.innerHTML = `<div class="rhead"><span class="rcaret">▶</span><span class="rlabel">思考过程</span><span class="rdot"></span><span class="rpeek"></span></div><div class="rbody"><div></div></div>`;
    el.dataset.state = entry.running ? 'running' : 'ok';
    // While the model is still thinking the block is open and follows the text; once the
    // turn's answer starts, it folds — that is the transition the operator asked for.
    if (entry.running) el.classList.add('open');
    // DSH shows the first line of the latest completed paragraph while running, and the
    // first line once settled; either way it is one ellipsised line.
    el.querySelector('.rpeek').textContent = firstMeaningfulLine(text);
    el.querySelector('.rbody > div').textContent = text;
    el.querySelector('.rhead').onclick = () => {
      el.classList.toggle('open');
      // keep the newest content in view when a block expands just above the bottom
      const log = $('log');
      if (log.scrollHeight - log.scrollTop - log.clientHeight < 160) log.scrollTop = log.scrollHeight;
    };
    return el;
  }
  if (t === 'tool-call') {
    // Parked on a card, or blocked by one: the approval entry already says it.
    if (entry.status === 'awaiting-approval' || entry.status === 'blocked') return null;
    return renderStep(entry);
  }
  if (t === 'tool-result') {
    const text = String(entry.result ?? '').trim();
    if (!text) return null;
    const el = document.createElement('div');
    el.className = 'card tool';
    el.innerHTML = `<div class="ct">结果</div><div class="cb"></div>`;
    el.querySelector('.cb').textContent = String(entry.result ?? '').slice(0, 4000);
    return el;
  }
  if (t === 'error') {
    const el = document.createElement('div');
    el.className = 'card error';
    el.innerHTML = `<div class="ct">error</div><div class="cb"></div>`;
    el.querySelector('.cb').textContent = entry.message ?? '';
    return el;
  }
  if (t === 'send-message' && entry.message?.type === 'auto-review-approval') {
    const el = document.createElement('div');
    el.className = 'card approval';
    el.dataset.entryId = entry.id;
    const ap = entry.message.approval ?? {};
    const resolved = entry.message.resolution;
    el.innerHTML = `<div class="ct"><span class="dotwarn"></span>需要批准</div><div class="cb"></div><div class="cf"></div>`;
    el.querySelector('.cb').textContent = ap.command ?? '';
    const foot = el.querySelector('.cf');
    if (resolved) {
      const label = resolved === 'approved' ? '已批准' : resolved === 'denied' ? '已拒绝'
        : resolved === 'always' ? '已批准，并记住这条命令' : resolved === 'expired' ? '已过期' : resolved;
      const denied = resolved === 'denied' || resolved === 'expired';
      el.classList.add('card-done');
      // Collapsed: a single quiet line with the verdict; the command expands on click.
      el.innerHTML = `<div class="donehead">
          <span class="doticon"></span>
          <span class="donetext"></span>
          <span class="donecmd"></span>
          <span class="donecaret">▶</span>
        </div>
        <div class="donebody"><pre></pre></div>`;
      el.querySelector('.doticon').textContent = denied ? '✕' : '✓';
      el.querySelector('.donetext').textContent = label;
      el.querySelector('.donecmd').textContent = (ap.command ?? '').replace(/\s+/g, ' ').slice(0, 80);
      el.querySelector('.donebody pre').textContent = ap.command ?? '';
      if (denied) el.style.setProperty('--done-color', 'var(--err)');
      el.querySelector('.donehead').onclick = () => el.classList.toggle('open');
      return el;
    } else {
      foot.innerHTML = `<button data-a="denied">拒绝</button>
        <button data-a="always">总是允许</button>
        <button data-a="approved">批准</button>`;
      foot.onclick = (e) => {
        const btn = e.target.closest('button');
        if (btn) resolveApproval(entry.id, btn.dataset.a);
      };
    }
    return el;
  }
  if (t === 'send-message' && entry.message?.type === 'question') {
    const el = document.createElement('div');
    el.className = 'card question';
    el.dataset.entryId = entry.id;
    el.innerHTML = `<div class="ct">需要你决定</div><div class="cb"></div><div class="cf"></div>`;
    el.querySelector('.cb').textContent = entry.message.prompt ?? '';
    const foot = el.querySelector('.cf');
    if (entry.message.answered) {
      foot.innerHTML = `<span class="resolved"></span>`;
      foot.firstElementChild.textContent = `已回答：${entry.message.answer}`;
    } else {
      for (const opt of entry.message.options ?? []) {
        const b = document.createElement('button');
        b.className = 'primary';
        b.textContent = opt;
        b.onclick = () => answerWidget(entry.id, opt);
        foot.appendChild(b);
      }
    }
    return el;
  }
  return null;
}

// A model can echo its own reasoning marker into the visible text. Strip the marker
// (keep the prose) so the stream never shows "</think:...>" to the operator.
function cleanText(text) {
  return String(text ?? '')
    .replace(/<\/?think:[0-9a-f-]+>/gi, '')
    .replace(/<\/?think>/gi, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

// A message can contain markdown-ish separators the model writes ("---"). Rendering
// them as literal dashes looked like a stray border; turn them into a real rule.
function renderRichText(target, raw) {
  const text = cleanText(raw);
  // Only a line that is exactly a rule marks a section break; a `---` inside a YAML
  // front-matter block (tool output) must stay verbatim.
  if (!/^\s*-{3,}\s*$/m.test(text)) {
    target.textContent = text;
    return;
  }
  const parts = text.split(/^\s*-{3,}\s*$/m);
  target.textContent = '';
  parts.forEach((part, i) => {
    if (i > 0) {
      const hr = document.createElement('span');
      hr.className = 'md-rule';
      target.appendChild(hr);
    }
    const chunk = part.replace(/^\n+|\n+$/g, '');
    if (chunk) target.appendChild(document.createTextNode(chunk));
  });
}

// DSH: latestCompletedParagraphFirstLine / firstLine, then strip markdown emphasis.
function firstMeaningfulLine(text) {
  const lines = String(text ?? '')
    .replace(/\*\*/g, '')
    .split('\n')
    .map((l) => l.trim())
    .filter(Boolean);
  return lines.length ? lines[lines.length > 1 ? lines.length - 1 : 0] : '';
}

// One row per id. The server is authoritative; merging keeps first-seen order.
function dedupe(rows) {
  const seen = new Map();
  for (const r of rows) {
    if (!r?.id) { seen.set(Symbol('anon'), r); continue; }
    seen.set(r.id, { ...(seen.get(r.id) ?? {}), ...r });
  }
  return [...seen.values()];
}

// Build the display units: a turn's process (reasoning + tool steps) is folded under
// one header, and the answer stands on its own. Rows without a turnId (older data,
// events) stay in plain flow.
function buildUnits(rows) {
  // Group by turn, not by adjacency. A turn interleaves reasoning and tool rows and may
  // emit an intermediate "I'll do X" answer between them; adjacency-based grouping split
  // that into several blocks and made the stream look out of order.
  const out = [];
  const turnUnit = new Map(); // turnId -> process unit, so all steps land in one block
  let turnStart = null;
  let currentTurnKey = null;
  let lastUnit = null;

  for (const entry of rows) {
    const t = entry.kind;
    const isProcess = t === 'reasoning' || t === 'tool-call' || t === 'tool-result';

    if (isProcess) {
      // A notice with no turnId is attributed to the turn whose steps just ran.
      const turnId = entry.turnId
        ?? (t === 'notice' ? lastProcessTurn : null)
        ?? currentTurnKey
        ?? 'no-turn';
      if (t !== 'notice') lastProcessTurn = turnId;
      let unit = turnUnit.get(turnId);
      if (!unit) {
        unit = {
          type: 'process',
          turnId,
          rows: [],
          startedAt: turnStart ?? entry.timestampMs ?? Date.now(),
          endedAt: entry.timestampMs ?? Date.now(),
        };
        turnUnit.set(turnId, unit);
        // insert at the position of this turn's first step
        out.push(unit);
      }
      unit.rows.push(entry);
      unit.endedAt = Math.max(unit.endedAt, entry.timestampMs ?? 0);
      lastUnit = unit;
      continue;
    }

    if (t === 'message' && entry.role === 'user') {
      turnStart = entry.timestampMs ?? null;
      currentTurnKey = `legacy-${entry.id}`;
    }
    const u = { type: 'entry', entry };
    out.push(u);
    lastUnit = u;
  }

  // Providers may report reasoning only at the end of a turn, which would place the
  // process block *below* the answer it produced. A turn's thinking always belongs
  // above its answer, so move the block there.
  for (const u of out) {
    if (u.type !== 'process' || u.turnId === 'no-turn') continue;
    const unitIdx = out.indexOf(u);
    const answerIdx = out.findIndex((x, i) => i < unitIdx && x.type === 'entry'
      && x.entry?.turnId === u.turnId && x.entry?.kind === 'send-message'
      && x.entry?.message?.type === 'text');
    if (answerIdx >= 0) {
      out.splice(unitIdx, 1);
      out.splice(answerIdx, 0, u);
    }
  }

  // A turn's duration runs from its user message to its final answer.
  for (const u of out) {
    if (u.type !== 'process') continue;
    const idx = out.indexOf(u);
    for (let j = idx + 1; j < out.length; j++) {
      const e = out[j].entry;
      if (!e) {
        // another turn begins: stop looking
        if (out[j].type === 'process') break;
        continue;
      }
      if (e.kind === 'message' && e.role === 'user') break;
      if (e.kind === 'send-message' && e.message?.type === 'text') {
        u.endedAt = Math.max(u.endedAt, e.timestampMs ?? 0);
      }
    }
  }
  return out;
}

// Follow the stream only when the reader is already at the bottom.
function autoScroll() {
  const log = $('log');
  if (log.scrollHeight - log.scrollTop - log.clientHeight < 160) log.scrollTop = log.scrollHeight;
}

function renderStream() {
  if (window.__MGB_DEBUG) {
    window.__dbg = { entriesLen: entries.length,
      kinds: [...new Set(entries.map(e => e.kind))],
      sample: entries.filter(e => e.kind === 'reasoning').slice(0,2).map(e => ({ id: e.id, len: (e.text||'').length, turn: e.turnId })) };
  }
  const log = $('log');
  // Entries flagged hidden belong to another surface (a group, for instance); they exist
  // in the transcript so the model can read them, but they never render here.
  const visible = entries.filter((e) => !e.hidden);
  // The newest turn is the one whose process block appears last.
  const procUnits = buildUnits(visible).filter((u) => u.type === 'process' && u.turnId !== 'no-turn');
  latestTurnId = procUnits.length ? procUnits[procUnits.length - 1].turnId : null;
  // Keep the operator where they were: a full rebuild on every event would otherwise
  // jump the stream to the bottom (or to the top when empty) mid-conversation.
  const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  const prevTop = log.scrollTop;
  log.innerHTML = '';
  if (!visible.length) {
    log.innerHTML = '<div class="empty" style="margin:auto;text-align:center">还没有对话。发一条消息试试。</div>';
    return;
  }
  let lastDay = null;
  const units = buildUnits(visible);
  // A process unit is rendered by its own path; the grouping pass only handles messages.
  const messageRows = units.filter((u) => u.type === 'entry').map((u) => u.entry);
  const grouped = new Map(annotateGroups(messageRows).map((g) => [g.entry.id, g]));
  for (const unit of units) {
    if (unit.type === 'process') {
      log.appendChild(renderTurnProcess(unit));
      continue;
    }
    const { entry, key, pos } = grouped.get(unit.entry.id) ?? { entry: unit.entry, key: null, pos: 'single' };
    const day = dayKey(entry.timestampMs ?? Date.now());
    if (day !== lastDay) {
      const d = document.createElement('div');
      d.className = 'day';
      d.textContent = fmtDay(entry.timestampMs ?? Date.now());
      log.appendChild(d);
      lastDay = day;
    }
    // An assistant row with no text (the model went straight to a tool call) is not a
    // message: rendering it produced an empty bubble above the tool card.
    const isText = entry.kind === 'send-message'
      ? (entry.message?.type === 'text' && String(entry.message?.content ?? '').trim().length > 0)
      : (entry.kind === 'message' && entry.message?.type === 'text'
         && (entry.role === 'user' || entry.role === 'assistant'));
    if (isText && key != null) {
      const mine = key === 'me' || key.startsWith('me:');
      const name = entry.fromAgent?.name ?? (mine ? 'You' : (agentName() || 'bot'));
      const isPending = pendingIds.has(entry.id);
      // A bot writing to the operator on its own initiative gets a quiet marker so it
      // is not mistaken for the answer to the message above it.
      const proactive = entry.proactive === true;
      const el = document.createElement('div');
      el.className = `msg ${mine ? 'mine' : ''} group-${pos}`
        + `${isPending ? ' pending' : ''}${proactive ? ' proactive' : ''}`;
      el.dataset.entryId = entry.id;
      // The bubble avatar must be the same object the roster renders — same shape,
      // colour and glyph — otherwise editing an avatar silently desyncs the chat.
      const speakerId = entry.fromAgent?.id ?? activeId;
      const speaker = agents.find((a) => a.id === speakerId) ?? agents.find((a) => a.id === activeId);
      const inGroup = agents.find((a) => a.id === activeId)?.isGroup === true;
      const named = inGroup && !mine && entry.fromAgent?.name;
      el.innerHTML = `${mine ? '' : avatarHTML(speaker ?? { id: speakerId, name: '?' }, 30)}
        <span class="stack">
          ${named && (pos === 'start' || pos === 'single') ? `<span class="sname">${esc(entry.fromAgent.name)}</span>` : ''}
          ${proactive ? '<span class="pmark">主动通知</span>' : ''}
          <span class="bubble${pos === 'end' || pos === 'single' ? ' has-time' : ''}"><span class="btext"></span>${
            pos === 'end' || pos === 'single'
              ? `<span class="stamp">${footerMeta(entry)}</span>`
              : ''
          }</span>
        </span>`;
      // Reserve exactly the stamp's width (measured after layout) so the last text line
      // never slides under "04:13 · 3076 tok · 4 tok/s".
      const stampEl = el.querySelector('.stamp');
      if (stampEl) {
        const apply = () => {
          // An attachment-only message has no bubble; the stamp lives on the media block.
          const bubble = el.querySelector('.bubble');
          if (!bubble) return;
          const w = stampEl.getBoundingClientRect().width;
          if (w > 0) bubble.style.setProperty('--slot-w', `${Math.ceil(w) + 16}px`);
        };
        // After this node is in the document and laid out.
        setTimeout(apply, 0);
        new ResizeObserver(apply).observe(stampEl);
      }
      // No name label: left/right + the avatar already identify the speaker.
      el.title = name;
      // Alt+click (or long-press) quotes this message into the composer.
      el.addEventListener('click', (ev) => {
        if (!ev.altKey) return;
        ev.preventDefault();
        setReplyTo(entry);
      });
      renderRichText(el.querySelector('.btext'), entry.message?.content);
      if (entry.replyTo) {
        const quoted = entries.find((x) => x.id === entry.replyTo);
        if (quoted) {
          const q = document.createElement('span');
          q.className = 'quote';
          const who = quoted.role === 'user'
            ? (quoted.fromAgent?.name ?? '我') : (quoted.fromAgent?.name ?? agentName() ?? 'bot');
          q.innerHTML = `<span class="qwho"></span><span class="qtext"></span>`;
          q.querySelector('.qwho').textContent = who;
          q.querySelector('.qtext').textContent =
            String(quoted.message?.content ?? '').replace(/\s+/g, ' ').slice(0, 90);
          el.querySelector('.bubble').insertBefore(q, el.querySelector('.bubble').firstChild);
        }
      }
      const files = Array.isArray(entry.attachments) ? entry.attachments : [];
      if (files.length) {
        const wrap = document.createElement('div');
        wrap.className = 'abox';
        for (const f of files) {
          const name = String(f).split('/').pop();
          const ext = name.split('.').pop().toLowerCase();
          // Images render inline; anything else stays a chip.
          if (['png','jpg','jpeg','gif','webp','svg','bmp'].includes(ext)) {
            const img = document.createElement('img');
            img.className = 'aimg';
            const clean = String(f).replace(/^workspace\//, '');
            img.src = `/files/${encodeURIComponent(clean)}`;
            img.alt = name;
            img.title = name;
            img.onclick = () => window.open(img.src, '_blank');
            wrap.appendChild(img);
          } else {
            const c = document.createElement('a');
            c.className = 'afile';
            c.href = `/files/${encodeURIComponent(String(f).replace(/^workspace\//, ''))}`;
            c.target = '_blank';
            c.rel = 'noreferrer';
            c.title = f;
            c.innerHTML = '<span class="aicon">📄</span><span class="aname"></span>';
            c.querySelector('.aname').textContent = name;
            wrap.appendChild(c);
          }
        }
        // Media sits above the bubble, its own rounded block — the way a chat app shows
        // an album. An attachment-only message drops the bubble entirely.
        const bubble = el.querySelector('.bubble');
        const btext = el.querySelector('.btext');
        const hasText = Boolean(btext && btext.textContent.trim());
        if (!hasText) {
          btext?.remove();
          // Keep the timestamp by moving it onto the media block.
          const stamp = el.querySelector('.stamp');
          if (stamp) wrap.appendChild(stamp);
          bubble?.remove();
        }
        const stack = el.querySelector('.stack') ?? el;
        stack.insertBefore(wrap, el.querySelector('.bubble') ?? null);
      }
      log.appendChild(el);
      continue;
    }
    let node = nodeFor(entry);
    if (node) {
      // Cards live inside the same column as bubbles.
      if (node.classList.contains('card')) {
        const wrap = document.createElement('div');
        wrap.className = 'cardwrap';
        wrap.appendChild(node);
        node = wrap;
      }
      log.appendChild(node);
    }
  }
  log.scrollTop = log.scrollHeight;
}

// The transcript window deliberately omits tool-call rows (same partial index the
// real host uses), so tool activity is merged back in from the outline.
function mergeOutline(rows, outline) {
  if (!outline.length) return rows;
  const out = rows.slice();
  for (const c of outline) {
    if (out.some((e) => e.kind === 'tool-call' && e.id === c.id)) continue;
    out.push({
      kind: 'tool-call', id: c.id, name: c.name, status: c.status, summary: c.summary,
      args: c.args ?? {}, turnId: c.turnId ?? null, timestampMs: c.timestampMs,
    });
    if (c.hasResult) {
      out.push({ kind: 'tool-result', id: `${c.id}-result`, callId: c.id, name: c.name, result: c.result, isError: c.isError, timestampMs: c.timestampMs + 1 });
    }
  }
  return out.sort((a, b) => (a.timestampMs ?? 0) - (b.timestampMs ?? 0));
}

// DSH step row: "✓ 已读取文件  shared/x.md  0.3s", expanding to the payload.
// One line per call keeps a burst of tool use scannable.
const STEP_VERBS = {
  shell: ['准备运行命令', '执行了命令'],
  read_file: ['准备读取文件', '已读取文件'],
  write_file: ['准备写入文件', '已写入文件'],
  list_dir: ['准备查看目录', '已查看目录'],
  recall_memory: ['准备读取记忆', '已读取记忆'],
  update_memory: ['准备写入记忆', '已写入记忆'],
  read_skill: ['准备读取技能', '已读取技能'],
  message_agent: ['准备通知 bot', '已通知 bot'],
  message_user: ['准备通知你', '已通知你'],
  ask_user: ['准备提问', '已向你提问'],
};

function stepVerb(name, done) {
  const pair = STEP_VERBS[name];
  if (pair) return done ? pair[1] : pair[0];
  return done ? `已调用 ${name}` : `准备调用 ${name}`;
}

function stepArgPreview(entry) {
  const args = entry.args ?? {};
  // Pick the argument a human would name the step by — a path, a command, a recipient.
  const v = args.path ?? args.command ?? args.to ?? args.name ?? args.slug
    ?? args.prompt ?? args.text;
  if (typeof v === 'string' && v.trim()) {
    const one = v.trim().replace(/\s+/g, ' ');
    return one.length > 72 ? `${one.slice(0, 72)}…` : one;
  }
  const keys = Object.keys(args);
  return keys.length ? `{${keys.join(', ')}}` : '';
}

function renderStep(entry, result) {
  const el = document.createElement('div');
  el.className = 'step';
  el.dataset.entryId = entry.id;
  el.dataset.callId = entry.callId ?? entry.id;

  const hasResult = Boolean(result);
  const running = entry.status === 'running' && !hasResult;
  const failed = entry.status === 'error' || result?.isError === true;
  el.dataset.state = failed ? 'error' : running ? 'running' : 'ok';

  // DSH's iconography: a small glyph, never a word.
  const icon = failed ? '✕' : running ? '◌' : '✓';
  const preview = stepArgPreview(entry);

  el.innerHTML = `<div class="s-head">
      <span class="s-caret">▶</span>
      <span class="s-ico"></span>
      <span class="s-title"></span>
      <span class="s-sep">·</span>
      <span class="s-arg"></span>
    </div>
    <div class="s-body"><div></div></div>`;
  el.querySelector('.s-ico').textContent = icon;
  el.querySelector('.s-title').textContent = stepVerb(entry.name, !running);
  el.querySelector('.s-arg').textContent = preview;
  // The separator is only meaningful when there is something after it.
  if (!preview) el.querySelector('.s-sep').style.display = 'none';

  // Body: one code block. Arguments first, the result below it — never expanded by
  // default, because the preview above already says what happened.
  const body = el.querySelector('.s-body > div');
  const blocks = [];
  const args = JSON.stringify(entry.args ?? {}, null, 2);
  if (args && args !== '{}') blocks.push({ label: preview || entry.name, text: args });
  if (hasResult) blocks.push({ label: 'result', text: String(result.result ?? '').slice(0, 8000), error: result.isError === true });
  if (!blocks.length) blocks.push({ label: entry.name, text: '(no payload)' });

  for (const b of blocks) {
    const box = document.createElement('div');
    box.className = 's-code';
    box.innerHTML = `<div class="s-codebar"><span class="s-dot"></span><span class="s-codelabel"></span><button class="s-copy" type="button">复制</button></div><pre class="s-pre"></pre>`;
    if (b.error) box.querySelector('.s-dot').style.background = 'var(--err)';
    box.querySelector('.s-codelabel').textContent = b.label;
    box.querySelector('.s-pre').textContent = b.text;
    box.querySelector('.s-copy').onclick = (ev) => {
      ev.stopPropagation();
      navigator.clipboard?.writeText(b.text);
      ev.target.textContent = '已复制';
      setTimeout(() => { ev.target.textContent = '复制'; }, 1200);
    };
    body.appendChild(box);
  }

  el.querySelector('.s-head').onclick = () => el.classList.toggle('open');
  return el;
}
// One turn's folded process: header says what happened, body holds the steps.
// The process block is just the reasoning (and any tool steps) — no extra
// "已完成" row wrapped around it. Duration and tokens belong to the answer footer,
// where Telegram puts them.
function renderTurnProcess(unit) {
  const frag = document.createDocumentFragment();

  const resultsByCall = new Map();
  for (const row of unit.rows) {
    if (row.kind === 'tool-result') {
      const key = row.callId ?? row.id;
      if (key) resultsByCall.set(key, row);
    }
  }

  const answered = settledTurns.has(unit.turnId) || entries.some(
    (e) => e.turnId === unit.turnId && e.kind === 'send-message' && e.message?.type === 'text'
      && String(e.message.content ?? '').trim(),
  );
  // Only the newest turn can still be running. A turn that was interrupted, or whose
  // answer never landed, used to look "进行中" forever because no answer row existed.
  const isLatestTurn = unit.turnId === latestTurnId;
  const terminated = entries.some((e) => e.turnId === unit.turnId
    && (e.kind === 'error' || (e.kind === 'notice' && e.level === 'warn')));

  // ONE process disclosure per turn. Reasoning, tool calls and peer notices are all
  // children of it, in the order they happened — a tool call is a step *inside* the
  // thinking, not a sibling row beside it.
  const steps = unit.rows.filter((r) => r.kind !== 'tool-result');
  if (!steps.length) return frag;

  const reasoningRows = steps.filter((r) => r.kind === 'reasoning');
  const previewText = reasoningRows.map((r) => cleanText(r.text ?? '')).filter(Boolean).join('\n\n');
  const running = isLatestTurn && !answered && !terminated;

  const el = document.createElement('div');
  el.className = 'reasoning';
  el.dataset.turnId = unit.turnId;
  el.dataset.state = running ? 'running' : 'ok';
  el.innerHTML = `<div class="rhead"><span class="rcaret">▶</span><span class="rlabel">思考过程</span><span class="rdot"></span><span class="rpeek"></span></div><div class="rbody"><div class="rstream"></div></div>`;
  // Collapsed: show the elapsed time only. A truncated preview of the thought was more
  // distracting than useful, and the step count already hints at what happened.
  const first = unit.rows.find((r) => r.timestampMs);
  const last = [...unit.rows].reverse().find((r) => r.timestampMs);
  const thoughtMs = first && last && last.timestampMs > first.timestampMs
    ? last.timestampMs - first.timestampMs : 0;
  const toolCount = steps.filter((r) => r.kind === 'tool-call').length;
  const bits = [];
  if (thoughtMs >= 1000) bits.push(`用时 ${fmtDuration(thoughtMs)}`);
  if (toolCount) bits.push(`${toolCount} 步`);
  el.querySelector('.rpeek').textContent = bits.length ? bits.join(' · ')
    : (running ? '' : '已完成');
  if (running) el.classList.add('open');

  const stream = el.querySelector('.rstream');

  // Emit in real order: a text segment, then the steps that followed it.
  let pending = [];
  const flushText = () => {
    const text = pending.map((r) => cleanText(r.text ?? '')).filter(Boolean).join('\n\n');
    pending = [];
    if (!text) return;
    const seg = document.createElement('div');
    seg.className = 'rseg';
    seg.textContent = text;
    stream.appendChild(seg);
  };

  for (const row of steps) {
    if (row.kind === 'reasoning') { pending.push(row); continue; }
    flushText();
    if (row.kind === 'tool-call') {
      const res = resultsByCall.get(row.callId ?? row.id);
      const merged = res
        ? { ...row, status: row.status === 'error' || res.isError ? 'error' : 'ok',
            durationMs: res.timestampMs && row.timestampMs ? res.timestampMs - row.timestampMs : null }
        : row;
      stream.appendChild(renderStep(merged, res));
      continue;
    }
    const node = nodeFor(row);
    if (node) stream.appendChild(node);
  }
  flushText();

  el.querySelector('.rhead').onclick = () => el.classList.toggle('open');
  frag.appendChild(el);
  return frag;
}

// What goes in the answer's bottom-right corner: time, and the turn's token spend.
// Telegram keeps this inside the bubble; the token count is the one extra fact worth
// carrying there because it answers "what did this cost me".
function footerMeta(entry) {
  const parts = [fmtTime(entry.timestampMs)];
  const u = turnUsage.get(entry.turnId);
  if (u?.total_tokens) parts.push(`${u.total_tokens} tok`);
  // Average output rate for the turn, kept after it finishes.
  const out = u?.completion_tokens;
  if (out && u?.measuredMs) {
    const rate = Math.round(out / (u.measuredMs / 1000));
    if (rate > 0) parts.push(`${rate} tok/s`);
  } else if (u?.charsPerSec) {
    parts.push(`${u.charsPerSec} 字/秒`);
  }
  return parts.join(' · ');
}

function fmtDuration(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return `${s}秒`;
  const m = Math.floor(s / 60);
  const r = s % 60;
  return r ? `${m}分${r}秒` : `${m}分`;
}

function agentName() {
  return agents.find((a) => a.id === activeId)?.name ?? 'bot';
}

/* ---------- pane ---------- */
// The real UI map has six tabs. Six does not fit a 300px pane without wrapping or
// scrolling, so they are merged into three that keep every section reachable:
//   overview  <- details
//   routines  <- tasks + library (产出)
//   computer  <- computer + proxy + workspace + meetings + members
const TAB_FALLBACK = ['overview', 'routines', 'computer'];
const TAB_LABELS = { overview: '详情', routines: '任务', computer: '主机' };
const TAB_MERGES = {
  overview: ['overview'],
  routines: ['routines', 'media'],
  computer: ['computer', 'meetings', 'members'],
};

function renderPane() {
  const tabs = TAB_FALLBACK;
  const labels = TAB_LABELS;
  const head = $('paneHead');
  head.innerHTML = '';
  for (const id of tabs) {
    const b = document.createElement('div');
    b.className = `tab${id === activeTab ? ' active' : ''}`;
    b.textContent = labels[id] ?? id;
    b.onclick = () => { activeTab = id; renderPane(); };
    head.appendChild(b);
  }

  const body = $('paneBody');
  body.innerHTML = '';
  const agent = agents.find((a) => a.id === activeId);
  const add = (html) => {
    const holder = document.createElement('div');
    holder.innerHTML = html;
    while (holder.firstChild) body.appendChild(holder.firstChild);
  };

  if (activeTab === 'overview') {
    add(`<div class="sec">${agent?.isGroup ? '群聊' : 'Bot'}</div>
      <div class="kv">
        <span class="k">名称</span><span data-f="name"></span>
        ${agent?.isGroup ? '' : '<span class="k">模型</span><span data-f="model"></span>'}
        <span class="k">接入点</span><span data-f="route"></span>
        <span class="k">执行位置</span><span data-f="harness"></span>
        <span class="k">编号</span><span data-f="id" style="word-break:break-all"></span>
      </div>`);
    const nameEl = body.querySelector('[data-f="name"]');
    if (nameEl && agent) {
      makeEditable(nameEl, {
        multiline: false,
        placeholder: 'bot 名称',
        save: async (value) => {
          const next = value.trim();
          if (!next) throw new Error('名称不能为空');
          await rpc('updateAgent', { agentId: activeId, patch: { name: next } });
          agent.name = next;
          const a = agents.find((x) => x.id === activeId);
          if (a) a.name = next;
          $('title').textContent = next;
          renderRoster();
        },
      });
    }
    body.querySelectorAll('[data-f]').forEach((el) => {
      const f = el.dataset.f;
      el.textContent = f === 'name' ? esc(agent?.name)
        : f === 'model' ? esc(binding.modelId ?? '—')
        : f === 'route' ? esc(binding.baseUrl ?? '—')
        : f === 'harness' ? (agent?.harness === 'temporal' ? '服务端' : '本机')
        : esc(String(agent?.id ?? '').slice(0, 8));
    });
    add(`<div class="avsec">
      <span class="avwrap">
        <span class="avslot" data-av>${agent.isGroup ? groupAvatar(agent.memberIds, 64) : avatarHTML(agent, 64, 'xl')}</span>
        ${agent.isGroup ? '' : '<button class="avedit-btn" data-avedit title="修改图标">✎</button>'}
      </span>
    </div>`);
    if (!agent.isGroup) {
      body.querySelector('[data-av]').ondblclick = () => openAvatarEditor(agent);
      body.querySelector('[data-avedit]').onclick = (e) => { e.stopPropagation(); openAvatarEditor(agent); };
    }

    if (agent?.isGroup) {
      const memberIds = agent.memberIds ?? [];
      add(`<div class="sec">群聊信息</div>
        <div class="entry"><div class="m">${memberIds.length} 个成员 · 消息会转发给全部成员</div></div>`);
      add(`<div class="sec"><span>成员 · ${memberIds.length}</span>
        <button class="mini" data-addmem>+ 加入 bot</button></div>`);
      add(`<div class="entry memlist" data-memlist></div>`);
      const list = body.querySelector('[data-memlist]');
      for (const mid of memberIds) {
        const m = agents.find((a) => a.id === mid);
        const row = document.createElement('div');
        row.className = 'memrow';
        row.innerHTML = `${m ? avatarHTML(m, 26) : ''}<span class="mn"></span>
          <button class="memx" title="移出群聊">✕</button>`;
        row.querySelector('.mn').textContent = m?.name ?? mid.slice(0, 8);
        row.querySelector('.memx').onclick = async (e) => {
          e.stopPropagation();
          if (!confirm(`把「${m?.name ?? mid}」移出这个群聊？`)) return;
          try {
            const next = memberIds.filter((x) => x !== mid);
            await rpc('setGroupMembers', { agentId: activeId, memberAgentIds: next });
            agent.memberIds = next;
            renderRoster(); renderPane();
            $('status').textContent = '已移出群聊';
          } catch (err) { $('status').textContent = err.message; }
        };
        list.appendChild(row);
      }
      body.querySelector('[data-addmem]').onclick = async () => {
        const candidates = agents.filter((a) => !a.isGroup && !memberIds.includes(a.id));
        if (!candidates.length) { $('status').textContent = '没有可加入的 bot'; return; }
        const pick = await askForm({
          title: '加入 bot',
          fields: [{
            name: 'who', label: `选择要加入的 bot`,
            value: '', placeholder: candidates.map((c) => c.name).join('、'),
          }],
          submitLabel: '加入',
        });
        if (!pick) return;
        const target = candidates.find((c) => c.name === pick.who.trim());
        if (!target) { $('status').textContent = '没有找到这个名字'; return; }
        try {
          const next = [...memberIds, target.id];
          await rpc('setGroupMembers', { agentId: activeId, memberAgentIds: next });
          agent.memberIds = next;
          renderRoster(); renderPane();
          $('status').textContent = `${target.name} 已加入`;
        } catch (err) { $('status').textContent = err.message; }
      };
    }

    add(`<div class="sec">职责<span class="hintx">双击编辑</span></div>
      <div class="entry desc"><div class="m" data-desc></div></div>`);
    const descEl = body.querySelector('[data-desc]');
    descEl.textContent = agent?.description || '—';
    makeEditable(descEl, {
      multiline: true,
      placeholder: '描述这个 bot 的职责',
      save: async (value) => {
        await rpc('updateAgent', { agentId: activeId, patch: { description: value } });
        const a = agents.find((x) => x.id === activeId);
        if (a) a.description = value;
        renderRoster();
      },
    });

    add(`<div class="sec">记忆<span class="hintx">双击编辑</span></div>
      <div class="entry mem"><div class="m" data-mem>读取中…</div></div>`);
    const memEl = body.querySelector('[data-mem]');
    rpc('readMemoryProfile', { agentId: activeId })
      .then((r) => {
        memEl.textContent = r.memory || '（空）';
        makeEditable(memEl, {
          multiline: true,
          placeholder: '这个 bot 的长期记忆（Markdown）',
          save: async (value) => {
            await rpc('writeMemoryProfile', { agentId: activeId, text: value });
          },
        });
      })
      .catch(() => { memEl.textContent = '读取失败'; });

    // Role action sits at the bottom of the pane, after everything else.
    const mainId = hostSettings?.mainAgentId ?? null;
    const mainAgent = agents.find((a) => a.id === mainId);
    const isMain = mainId === activeId;
    const holder = mainAgent && !isMain ? mainAgent.name : null;
    add(`<div class="sec">角色</div>
      <div class="entry role">
        <div class="m" data-role></div>
        <button class="bigbtn" data-setmain></button>
      </div>`);
    body.querySelector('[data-role]').textContent = isMain
      ? '这个 bot 现在是幕僚长。'
      : (holder ? `当前幕僚长：${holder}` : '还没有设置幕僚长。');
    const roleBtn = body.querySelector('[data-setmain]');
    roleBtn.textContent = isMain ? '取消幕僚长' : (holder ? '替换为幕僚长' : '设为幕僚长');
    roleBtn.className = `bigbtn${isMain ? '' : ' primary'}`;
    roleBtn.onclick = () => setChiefOfStaff(agent, { isMain, holder, mainId });

    // Destructive action last, visually separated from the role control above it.
    add(`<div class="sec">危险操作</div>
      <div class="entry danger">
        <div class="m">删除这个 bot：对话记录、记忆和本地数据都会一并移除，无法撤销。</div>
        <button class="bigbtn danger" data-delbot>删除 bot</button>
      </div>`);

async function selectAgent(id) {
  if (activeId && activeId !== id) drafts.set(activeId, $('input').value);
  const switched = activeId !== id;
  activeId = id;
  renderRoster();
  restoreComposer();
  const a = agents.find((x) => x.id === id);
  $('title').textContent = a?.name ?? '—';
  $('subtitle').textContent = a?.description || '';
  const av = $('headAvatar');
  // A group shows its member cluster everywhere it appears, not a single shape.
  av.innerHTML = a ? (a.isGroup ? groupAvatar(a.memberIds, 28) : avatarHTML(a, 28)) : '';

  binding = a?.isGroup ? {} : await rpc('getAgentBinding', { agentId: id }).catch(() => ({}));
  $('model').textContent = a?.isGroup ? '群聊' : (binding.modelId ?? '—');
  $('model').style.display = a?.isGroup ? 'none' : '';
  modelCatalog = null; // the base URL may differ per agent
  const route = await rpc('getAgentRoute', { agentId: id }).catch(() => null);
  $('subtitle').textContent = `${a?.description || ''}${route?.proxied ? ' · runs on the server' : ''}`;

  const [rows, outline, pending] = await Promise.all([
    rpc('getAgentTranscript', { agentId: id, limit: 300 }),
    rpc('getAgentOutline', { agentId: id }).catch(() => []),
    rpc('getPendingEntryIds', { agentId: id }).catch(() => []),
  ]);
  pendingIds = new Set(pending ?? []);
  entries = mergeOutline(rows.slice().sort((x, y) => x.seq - y.seq), outline ?? []);
  renderStream();
  await refreshPaneData();
  rpc('setActiveAgent', { agentId: id }).catch(() => {});
}

async function refreshPaneData() {
  if (!activeId) return;
  const [r, rules, status, map] = await Promise.all([
    rpc('getAgentAutomations', { agentId: activeId }).catch(() => []),
    rpc('getAutoReviewRules').catch(() => ({})),
    rpc('getHostStatus').catch(() => ({})),
    rpc('getServiceMap').catch(() => null),
  ]);
  routines = r ?? [];
  reviewRules = rules ?? {};
  hostStatus = { ...(status ?? {}), ports: map?.ports ?? {} };
  renderPane();
}

// Trigger one room round and surface each member's outcome as a service line.
// Wide windows collapse the pane; narrow ones (where it is folded away by default)
// reveal it as an overlay instead. One button, two behaviours, no scrollbar.
// Three width regimes, one meaning for the button (“show/hide details”):
//   >1200px  the pane is a grid track; hidden by .no-pane
//   821–1200 the pane is a grid track revealed by .overlay-open
//   <=820    the pane is an overlay, mutually exclusive with the roster
function paneOpen() {
  const app = $('app');
  if (window.matchMedia('(max-width: 820px)').matches) return app.classList.contains('pane-open');
  if (window.matchMedia('(max-width: 1200px)').matches) return app.classList.contains('overlay-open');
  return !app.classList.contains('no-pane');
}

function togglePane() {
  const app = $('app');
  if (window.matchMedia('(max-width: 820px)').matches) {
    app.classList.remove('rail-open');
    app.classList.toggle('pane-open');
    return;
  }
  if (window.matchMedia('(max-width: 1200px)').matches) {
    app.classList.toggle('overlay-open');
    return;
  }
  app.classList.toggle('no-pane');
}

// Same idea for the roster: "no-rail" always means hidden.
function toggleRail() {
  const app = $('app');
  if (window.matchMedia('(max-width: 820px)').matches) {
    app.classList.remove('pane-open');
    // Drawer mode: the rail is shown full-width with labels, never the icon variant.
    app.classList.remove('no-rail');
    app.classList.toggle('rail-open');
    return;
  }
  app.classList.toggle('no-rail');
}

// Tapping the backdrop closes whichever overlay is open.
document.addEventListener('click', (e) => {
  const app = $('app');
  if (!app.classList.contains('rail-open') && !app.classList.contains('pane-open')) return;
  if (e.target.closest('.rail, .pane, #toggleInfo, #toggleRail')) return;
  app.classList.remove('rail-open', 'pane-open');
});

// Narrow screens start with the side panels folded so the conversation gets the room.
// Narrow screens start with the side panels folded so the conversation gets the room.
(() => {
  const app = $('app');
  if (window.matchMedia('(max-width: 1200px)').matches) app.classList.add('no-pane');
  // The narrow layout hides the rail with CSS; `no-rail` would also strip the labels
  // from the drawer, which is why the drawer used to open as a column of bare icons.
  app.classList.remove('no-rail');
})();

async function runRoomRound() {
  if (!activeId) return;
  $('status').textContent = '群组发言中…';
  const seen = [];
  const unsub = hostEvents.subscribe((ev) => {
    if (ev.type === 'room-member-turn-end' && ev.agentId === activeId) {
      const name = agents.find((a) => a.id === ev.memberAgentId)?.name ?? ev.memberAgentId.slice(0, 8);
      seen.push(`${name}: ${ev.outcome}`);
      entries.push({
        kind: 'notice',
        id: `room-${ev.nonce}`,
        text: `${name} → ${ev.outcome}`,
        level: ev.shown ? 'info' : 'warn',
        timestampMs: Date.now(),
      });
      renderStream();
    }
  });
  try {
    const out = await rpc('runRoomTurn', { roomId: activeId, newMessages: [] });
    $('status').textContent = `round done · ${out.results.length} member(s)`;
    reloadTranscript();
  } catch (err) {
    $('status').textContent = String(err.message);
  } finally {
    unsub();
  }
}

async function resolveApproval(entryId, resolution) {

    $('status').textContent = resolution === 'always' ? '已放行并记住该命令'
      : `已${resolution === 'approved' ? '批准' : '拒绝'}`;
  } catch (err) {
    $('status').textContent = String(err.message);
  }
}

async function answerWidget(entryId, value) {

}

// ---- @mentions -------------------------------------------------------------
// Typing "@" opens a picker: group members in a room, every other bot in a 1:1 chat.
// In a group the mentions decide who answers; the rest still receive the message.
let mentionState = null; // { start, items, index }

function mentionCandidates() {
  const current = agents.find((a) => a.id === activeId);
  if (current?.isGroup) {
    return (current.memberIds ?? [])
      .map((id) => agents.find((a) => a.id === id))
      .filter(Boolean);
  }
  return agents.filter((a) => !a.isGroup && a.id !== activeId);
}

function closeMention() {
  mentionState = null;
  document.getElementById('mentionPop')?.remove();
}

function renderMentionPop() {
  document.getElementById('mentionPop')?.remove();
  if (!mentionState || !mentionState.items.length) return;
  const pop = document.createElement('div');
  pop.id = 'mentionPop';
  pop.className = 'mentionpop';
  pop.innerHTML = mentionState.items.map((a, i) =>
    `<button class="mitem${i === mentionState.index ? ' on' : ''}" data-i="${i}">
       ${avatarHTML(a, 20)}<span class="mname"></span>
     </button>`).join('');
  pop.querySelectorAll('.mname').forEach((n, i) => { n.textContent = mentionState.items[i].name; });
  pop.querySelectorAll('.mitem').forEach((b) => {
    b.onmousedown = (e) => { e.preventDefault(); pickMention(Number(b.dataset.i)); };
  });
  const input = $('input');
  const r = input.getBoundingClientRect();
  pop.style.left = `${Math.round(r.left)}px`;
  pop.style.bottom = `${Math.round(window.innerHeight - r.top + 6)}px`;
  document.body.appendChild(pop);
}

function pickMention(i) {
  const input = $('input');
  const item = mentionState?.items[i];
  if (!item) return closeMention();
  const text = input.value;
  const start = mentionState.start;
  const head = text.slice(0, start);
  const tail = text.slice(input.selectionStart ?? text.length);
  const inserted = `@${item.name} `;
  input.value = `${head}${inserted}${tail}`;
  const caret = head.length + inserted.length;
  input.setSelectionRange(caret, caret);
  input.focus();
  closeMention();
  drafts.set(activeId, input.value);
}

function updateMentionState() {
  const input = $('input');
  const caret = input.selectionStart ?? input.value.length;
  const upto = input.value.slice(0, caret);
  const m = /(^|\s)@([^\s@]*)$/.exec(upto);
  if (!m) return closeMention();
  const query = m[2].toLowerCase();
  const items = mentionCandidates().filter((a) => a.name.toLowerCase().includes(query)).slice(0, 6);
  if (!items.length) return closeMention();
  const start = caret - query.length - 1;
  const keep = mentionState && mentionState.start === start ? mentionState.index : 0;
  mentionState = { start, items, index: Math.min(keep, items.length - 1) };
  renderMentionPop();
}

// Ids of the bots named with @ in the current text. Matching is longest-first and
// global: several mentions are supported, "Nas Bot" does not also match inside
// "Nas Bot X", and repeats collapse to one id.
function mentionedAgentIds(text) {
  const list = mentionCandidates();
  if (!list.length) return [];
  const names = [...list].sort((a, b) => b.name.length - a.name.length);
  const pattern = names
    .map((a) => a.name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
    .join('|');
  const re = new RegExp(`@(${pattern})`, 'g');
  const found = new Set();
  for (let m = re.exec(text); m; m = re.exec(text)) {
    const hit = names.find((a) => a.name === m[1]);
    if (hit) found.add(hit.id);
  }
  return [...found];
}

async function send() {
  const input = $('input');
  const text = input.value.trim();
  // Empty text is fine when something is attached.
  if ((!text && !pendingFiles.length) || !activeId) return;
  input.value = '';
  input.style.height = 'auto';
  $('status').textContent = '发送中…';
  try {
    // Attachments already live in workspace/uploads; their paths ride with the prompt.
    const paths = pendingFiles.map((f) => f.path);
    const mentions = mentionedAgentIds(text);
    const acc = await rpc('sendPrompt', {
      agentId: activeId, prompt: text,
      ...(paths.length ? { attachmentPaths: paths } : {}),
      ...(mentions.length ? { mentionAgentIds: mentions } : {}),
      ...(replyTarget ? { replyTo: replyTarget.id } : {}),
    });
    clearReply();
    if (paths.length) { pendingFiles = []; renderChips(); }
    // Optimistic row under the nonce, so the operator sees their message instantly.
    if (acc?.clientNonce && acc?.entryId) {
      changedMids.set(acc.clientNonce, acc.entryId);
      if (!entries.some((e) => e.id === acc.entryId || e.id === acc.clientNonce)) {
        entries.push({
          kind: 'message', id: acc.entryId, role: 'user', clientNonce: acc.clientNonce,
          message: { type: 'text', content: text },
          ...(paths.length ? { attachments: paths } : {}),
          timestampMs: acc.acceptedAtMs ?? Date.now(),
        });
        pendingIds.add(acc.entryId);
        renderStream();
      }
    }
    $('status').textContent = '';
  } catch (err) {
    $('status').textContent = String(err.message);
  }
}

// Apply the host's nonce->entryId table: any node still keyed by a nonce is re-keyed
// to its real entry id, without touching the rest of the stream.
function applyChangedMids(pairs) {
  let changed = false;
  for (const [nonce, entryId] of pairs ?? []) {
    changedMids.set(nonce, entryId);
    const node = document.querySelector(`[data-entry-id="${nonce}"]`);
    if (node) {
      node.dataset.entryId = entryId;
      changed = true;
    }
  }
  return changed;
}

let paletteSel = 0;
let paletteItems = [];

function openPalette() {
  $('paletteInput').value = '';
  renderPalette('');
  $('palette').classList.add('open');
  $('paletteInput').focus();
}
function closePalette() { $('palette').classList.remove('open'); }

function renderPalette(q) {
  // Local commands are always available; the real UI map contributes the rest.
  const all = [...(commands.length ? commands : []), ...PALETTE_FALLBACK];
  paletteItems = all.filter((c) => !q || `${c.label} ${c.id}`.toLowerCase().includes(q.toLowerCase())).slice(0, 12);
  paletteSel = 0;
  const list = $('paletteList');
  list.innerHTML = '';
  paletteItems.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = `item${i === paletteSel ? ' sel' : ''}`;
    el.innerHTML = '<span></span><span class="sc"></span>';
    el.firstElementChild.textContent = zhLabel(c);
    el.lastElementChild.textContent = c.shortcut ?? '';
    el.onclick = () => runCommand(paletteItems[i]);
    list.appendChild(el);
  });
  if (!paletteItems.length) list.innerHTML = '<div class="empty" style="padding:14px">没有匹配的命令</div>';
}

function runCommand(cmd) {
  closePalette();
  // A local command carries its own action; the UI-map ones are matched by id below.
  if (typeof cmd?.run === 'function') { cmd.run(); return; }
  switch (cmd && cmd.id) {
    case 'sand.send': $('send').click(); break;
    case 'sand.focusInput': $('input').focus(); break;
    case 'sand.toggleInfo': togglePane(); break;
    case 'sand.toggleSidebar': $('app').classList.toggle('no-rail'); break;
    case 'sand.newAgent': createAgent(); break;
    case 'sand.findInChat': $('search').focus(); break;
    default: $('status').textContent = `command: ${cmd && cmd.id}`;
  }
}

  const r = anchor.getBoundingClientRect();

  menu.style.top = `${Math.round(r.bottom + 6)}px`;
  const close = () => { menu.remove(); document.removeEventListener('click', onDoc, true); };
  const onDoc = (e) => { if (!menu.contains(e.target) && e.target !== anchor) close(); };
  setTimeout(() => document.addEventListener('click', onDoc, true), 0);
  menu.querySelector('[data-new="bot"]').onclick = () => { close(); createAgent(); };
  menu.querySelector('[data-new="group"]').onclick = () => { close(); createGroup(); };
}
